<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>Pro Game Builder | Studio Taqi</title>
<style>
    :root {
        --primary: #8b5cf6;
        --accent: #d946ef;
        --bg: #020617;
        --card: #0f172a;
        --line: #1e293b;
        --muted: #94a3b8;
        --safe-b: env(safe-area-inset-bottom, 0px);
    }

    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

    html { height: 100%; }

    body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: #fff;
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
    }

    /* ---------- TOP BAR ---------- */
    .topbar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        padding-top: calc(12px + env(safe-area-inset-top, 0px));
        background: #070a13;
        border-bottom: 1px solid var(--line);
    }
    .topbar h1 {
        margin: 0;
        font-size: 14px;
        letter-spacing: 1.5px;
        color: var(--primary);
    }

    /* ---------- MAIN / PANES ---------- */
    main { flex: 1; min-height: 0; display: flex; }

    .pane {
        display: none;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        padding: 16px;
    }
    .pane.active { display: flex; flex-direction: column; gap: 14px; }

    /* ---------- STAGE NAV ---------- */
    .stage-nav {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: none;
    }
    .stage-nav::-webkit-scrollbar { display: none; }

    .stage-dot {
        flex: 0 0 auto;
        min-width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        user-select: none;
        transition: 0.2s;
    }
    .stage-dot:active { transform: scale(0.94); }
    .stage-dot.active {
        background: var(--primary);
        box-shadow: 0 0 15px rgba(139, 92, 246, 0.45);
    }

    /* ---------- EDIT BOX ---------- */
    .edit-box {
        background: var(--card);
        padding: 16px;
        border-radius: 16px;
        border: 1px solid #334155;
    }

    label {
        display: block;
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        margin: 14px 0 6px;
        letter-spacing: 1px;
        font-weight: 600;
    }
    label:first-child { margin-top: 0; }

    input, textarea {
        width: 100%;
        background: #020617;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 13px;
        color: #fff;
        font-size: 16px;      /* 16px = iOS doesn't zoom on focus */
        font-family: inherit;
        outline: none;
        -webkit-appearance: none;
        appearance: none;
    }
    textarea { resize: vertical; min-height: 84px; }
    input:focus, textarea:focus { border-color: var(--primary); }

    .answer-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
    }
    .answer-row input[type="radio"] {
        -webkit-appearance: radio;
        appearance: radio;
        width: 24px;
        height: 24px;
        flex: 0 0 auto;
        margin: 0;
        accent-color: var(--primary);
        cursor: pointer;
    }
    .answer-row input[type="text"] {
        flex: 1;
        min-width: 0;
    }

    /* ---------- BUTTONS ---------- */
    .action-btn {
        background: var(--primary);
        color: #fff;
        border: none;
        padding: 14px 18px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.5px;
        min-height: 46px;
        transition: 0.2s;
    }
    .action-btn:active { transform: scale(0.97); }

    .download-btn {
        background: #fff;
        color: #000;
        margin-top: 4px;
        padding: 16px;
        font-size: 14px;
    }

    /* ---------- PREVIEW ---------- */
    #previewPane {
        background: radial-gradient(circle at top right, #1e1b4b, #020617);
    }
    .preview-inner {
        margin: auto 0;          /* safely centres without clipping */
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
    }

    .game-screen {
        width: 100%;
        max-width: 420px;
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 26px;
        padding: 26px 20px;
        text-align: center;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }
    .game-screen h2 { font-size: 19px; line-height: 1.35; }

    .preview-btn {
        display: block;
        width: 100%;
        padding: 16px;
        margin: 10px 0;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: #fff;
        font-size: 15px;
        font-family: inherit;
        text-align: center;
        transition: 0.3s;
    }

    /* ---------- CODE VIEW ---------- */
    .code-wrap {
        width: 100%;
        max-width: 420px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #000;
        overflow: hidden;
    }
    .code-wrap summary {
        padding: 14px 16px;
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
        cursor: pointer;
        list-style: none;
    }
    .code-wrap summary::-webkit-details-marker { display: none; }
    .code-wrap summary::before { content: "▸ "; }
    .code-wrap[open] summary::before { content: "▾ "; }

    .code-view {
        height: 180px;
        color: #10b981;
        padding: 0 14px 14px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        line-height: 1.5;
        white-space: pre;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
    }

    /* ---------- BOTTOM TAB BAR (mobile only) ---------- */
    .tabbar {
        flex-shrink: 0;
        display: flex;
        background: #070a13;
        border-top: 1px solid var(--line);
        padding-bottom: var(--safe-b);
    }
    .tabbar button {
        flex: 1;
        background: none;
        border: 0;
        color: var(--muted);
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
        padding: 10px 0 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        min-height: 56px;
    }
    .tabbar button .icon { font-size: 19px; line-height: 1; }
    .tabbar button.active { color: var(--primary); }

    /* ---------- DESKTOP / TABLET: side-by-side, no tabs ---------- */
    @media (min-width: 900px) {
        .tabbar { display: none; }

        main { flex-direction: row; }

        #editorPane {
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 0 0 400px;
            width: 400px;
            border-right: 1px solid var(--line);
            background: #070a13;
            padding: 22px;
        }

        #previewPane {
            display: flex;
            flex: 1;
            padding: 40px;
            justify-content: center;
        }

        .preview-inner { margin: auto; }

        .game-screen { padding: 40px; }
        .code-wrap { max-width: 800px; }
        .code-view { height: 140px; font-size: 11px; padding: 0 16px 16px; }
        .stage-dot { min-width: 35px; height: 35px; }
        .action-btn { min-height: auto; }
    }

    @media (min-width: 1400px) {
        #editorPane { flex-basis: 440px; width: 440px; }
    }
</style>
</head>
<body>

<div class="topbar">
    <h1>GAME STUDIO</h1>
    <button class="action-btn" onclick="addStage()">+ NEW STAGE</button>
</div>

<main>
    <!-- ============ EDITOR ============ -->
    <section class="pane active" id="editorPane">
        <div>
            <label>Select Stage to Edit</label>
            <div class="stage-nav" id="stageNav"></div>
        </div>

        <div class="edit-box" id="editorContent">
            <label>Stage Question</label>
            <textarea id="qInput" rows="3" placeholder="Enter your challenge..."></textarea>

            <label>Answers (tap the circle to mark the correct one)</label>
            <div id="optionsContainer"></div>
        </div>

        <button class="action-btn download-btn" onclick="downloadGame()">📥 DOWNLOAD GAME</button>
    </section>

    <!-- ============ PREVIEW ============ -->
    <section class="pane" id="previewPane">
        <div class="preview-inner">
            <div class="game-screen" id="gameScreen"></div>

            <details class="code-wrap">
                <summary>Generated HTML</summary>
                <div class="code-view" id="codeOutput"></div>
            </details>
        </div>
    </section>
</main>

<!-- ============ BOTTOM TABS (mobile) ============ -->
<nav class="tabbar">
    <button class="active" data-tab="editor" onclick="switchTab('editor')">
        <span class="icon">✏️</span> EDIT
    </button>
    <button data-tab="preview" onclick="switchTab('preview')">
        <span class="icon">👁️</span> PREVIEW
    </button>
</nav>

<script>
    let stages = [
        { q: "What is 5 + 5?", options: ["10", "15", "20"], correct: 0 }
    ];
    let activeIdx = 0;

    /* ---------- TABS ---------- */
    function switchTab(name) {
        document.querySelectorAll('.tabbar button').forEach(b => {
            b.classList.toggle('active', b.dataset.tab === name);
        });
        document.getElementById('editorPane').classList.toggle('active', name === 'editor');
        document.getElementById('previewPane').classList.toggle('active', name === 'preview');
        if (name === 'preview') renderPreview();
    }

    /* ---------- CORE ---------- */
    function init() {
        renderNav();
        renderEditor();
        renderPreview();
    }

    function addStage() {
        stages.push({ q: "New Question?", options: ["Option A", "Option B", "Option C"], correct: 0 });
        activeIdx = stages.length - 1;
        init();
        switchTab('editor');
        // scroll the new stage dot into view
        const nav = document.getElementById('stageNav');
        nav.scrollLeft = nav.scrollWidth;
    }

    function renderNav() {
        const nav = document.getElementById('stageNav');
        nav.innerHTML = stages.map((s, i) => `
            <div class="stage-dot ${i === activeIdx ? 'active' : ''}" onclick="switchStage(${i})">${i + 1}</div>
        `).join('');
    }

    function switchStage(i) {
        activeIdx = i;
        init();
    }

    function renderEditor() {
        const stage = stages[activeIdx];
        const qInput = document.getElementById('qInput');
        qInput.value = stage.q;
        qInput.oninput = (e) => { stages[activeIdx].q = e.target.value; renderPreview(); };

        const optContainer = document.getElementById('optionsContainer');
        optContainer.innerHTML = stage.options.map((opt, i) => `
            <div class="answer-row">
                <input type="radio" name="correct" ${stage.correct === i ? 'checked' : ''} onchange="setCorrect(${i})">
                <input type="text" value="${opt.replace(/"/g, '&quot;')}" oninput="setOption(${i}, this.value)">
            </div>
        `).join('');
    }

    function setOption(optIdx, val) {
        stages[activeIdx].options[optIdx] = val;
        renderPreview();
    }

    function setCorrect(i) {
        stages[activeIdx].correct = i;
        renderPreview();
    }

    function renderPreview() {
        const stage = stages[activeIdx];
        const screen = document.getElementById('gameScreen');
        screen.innerHTML = `
            <div style="font-size:11px; color:var(--primary); letter-spacing:2px; margin-bottom:10px;">STAGE ${activeIdx + 1}</div>
            <h2 style="margin:0 0 26px; font-weight:600;">${stage.q}</h2>
            ${stage.options.map((opt, i) => `<div class="preview-btn">${opt}</div>`).join('')}
        `;
        generateCode();
    }

    /* ---------- EXPORT ---------- */
    function generateCode() {
        const gameJSON = JSON.stringify(stages);
        const fullCode = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>My Game</title>
<style>
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
        background:#020617; color:#fff; margin:0; padding:20px;
        font-family:system-ui,-apple-system,sans-serif;
        display:flex; justify-content:center; align-items:center;
        min-height:100vh; min-height:100dvh;
    }
    #box {
        width:100%; max-width:400px; background:#0f172a; padding:28px 22px;
        border-radius:25px; text-align:center; border:1px solid #1e293b;
        box-shadow:0 20px 50px rgba(0,0,0,0.5);
    }
    .opt {
        display:block; width:100%; padding:16px; margin:12px 0;
        background:#1e293b; border:none; color:#fff; border-radius:12px;
        cursor:pointer; font-weight:bold; font-size:16px; font-family:inherit;
        transition:0.3s;
    }
    .opt:hover { background:#8b5cf6; transform:scale(1.02); }
    .opt:active { transform:scale(0.97); }
    h4 { color:#8b5cf6; margin:0 0 12px; letter-spacing:1px; font-size:12px; }
    h2 { font-size:20px; line-height:1.35; margin:0 0 24px; }
</style>
</head>
<body>
<div id="box"></div>
<script>
    const stages = ${gameJSON};
    // PERSISTENCE: progress is saved even after closing the browser
    let idx = parseInt(localStorage.getItem('game_step')) || 0;

    function play() {
        var box = document.getElementById('box');
        if (idx >= stages.length) {
            box.innerHTML = "<h1>\\u{1F3C6} Victory!</h1><p>You finished the game.</p><button class='opt' onclick='reset()'>Restart</button>";
            return;
        }
        var s = stages[idx];
        box.innerHTML = "<h4>STAGE " + (idx + 1) + "</h4><h2>" + s.q + "</h2>" +
            s.options.map(function (o, i) {
                return "<button class='opt' onclick='check(" + i + ")'>" + o + "</button>";
            }).join('');
    }

    function check(i) {
        if (i === stages[idx].correct) {
            idx++;
            localStorage.setItem('game_step', idx);
            play();
        } else {
            alert("Incorrect! You must stay at this stage until you learn the answer.");
        }
    }

    function reset() {
        localStorage.setItem('game_step', 0);
        idx = 0;
        play();
    }

    play();
<\/script>
</body>
</html>`;
        document.getElementById('codeOutput').innerText = fullCode;
    }

    function downloadGame() {
        const blob = new Blob([document.getElementById('codeOutput').innerText], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'my_custom_logic_game.html';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    init();
</script>

</body>
</html>
