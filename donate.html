<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donate</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1e2f 0%, #2b2b45 50%, #1a1a2e 100%);
    color: #fff;
    padding: 20px;
    overflow-x: hidden;
  }

  .card {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 45px 35px;
    text-align: center;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    animation: fadeIn 0.7s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(25px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-size: 2.2rem;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #ffd86f, #fc6262);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: #b8b8d0;
    font-size: 0.95rem;
    margin-bottom: 30px;
    line-height: 1.5;
  }

  /* DONATE BUTTON */
  .donate-btn {
    background: linear-gradient(135deg, #ff8a00, #e52e71);
    color: #fff;
    border: none;
    padding: 18px 60px;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 2px;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 10px 30px rgba(229, 46, 113, 0.45);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 10px 30px rgba(229, 46, 113, 0.45); }
    50%      { box-shadow: 0 10px 45px rgba(255, 138, 0, 0.75); }
  }

  .donate-btn:hover {
    transform: scale(1.07);
  }

  .donate-btn:active {
    transform: scale(0.96);
  }

  /* HIDDEN QR AREA */
  .qr-area {
    display: none;
    margin-top: 30px;
    animation: popIn 0.5s ease;
  }

  .qr-area.show {
    display: block;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }

  .qr-box {
    background: #fff;
    padding: 14px;
    border-radius: 18px;
    display: inline-block;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  }

  .qr-box img {
    display: block;
    width: 240px;
    height: 240px;
    object-fit: contain;
    border-radius: 8px;
  }

  .qr-note {
    margin-top: 22px;
    font-size: 1.05rem;
    line-height: 1.7;
    color: #ffe9a8;
    font-weight: 600;
  }

  .qr-note span {
    display: block;
    font-size: 0.85rem;
    color: #b8b8d0;
    font-weight: 400;
    margin-top: 8px;
  }

  .heart {
    font-size: 1.6rem;
    display: inline-block;
    animation: beat 1.2s infinite;
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25%      { transform: scale(1.25); }
    50%      { transform: scale(1); }
    75%      { transform: scale(1.15); }
  }

  @media (max-width: 400px) {
    .qr-box img { width: 190px; height: 190px; }
    h1 { font-size: 1.8rem; }
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Support Us</h1>
    <p class="subtitle">Your kindness keeps us going. Every contribution counts!</p>

    <button class="donate-btn" id="donateBtn">DONATE</button>

    <div class="qr-area" id="qrArea">
      <div class="qr-box">
        <img src="qr.png" alt="Donation QR Code">
      </div>

      <p class="qr-note">
        <span class="heart">❤️</span><br>
        Donate as much money as you want —<br>
        as much as your heart desires!
        <span>Scan the QR code above with any payment app.</span>
      </p>
    </div>
  </div>

<script>
  const btn = document.getElementById('donateBtn');
  const qrArea = document.getElementById('qrArea');

  btn.addEventListener('click', () => {
    qrArea.classList.add('show');
    btn.style.display = 'none';
  });
</script>

</body>
</html>
