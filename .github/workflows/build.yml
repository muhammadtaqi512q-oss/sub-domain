name: Secure Military-Grade AES Obfuscation and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-secure-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Python ke standard libraries ke sath robust dynamic encryption run karna
      - name: Advanced Crypto Encryption Engine
        env:
          SECRET_JSON: ${{ secrets.MY_SECRET_JS_CODE }}
        run: |
          python -c "
          import os, json, base64, hashlib, secrets

          secret_json_str = os.environ.get('SECRET_JSON', '{}')
          try:
              secrets_map = json.loads(secret_json_str)
          except Exception as e:
              print('Error: Secret JSON structure faulty hai!', e); exit(1)

          encrypted_map = {}
          
          mapping = {
              'soft.js': 'soft',
              '13.js': '13',
              '2.js': '2',
              '20.js': '20',
              '3.js': '3',
              '4.js': '4',
              '5.js': '5'
          }

          # Dynamic random payload key generate karna jo har push par badal jaye gi
          dynamic_passphrase = secrets.token_hex(32)
          hashed_key = hashlib.sha256(dynamic_passphrase.encode()).hexdigest()

          # Anti-Debugging script injection hook (Koi console kholey ga tou crash ho jaye ga)
          anti_debug_hook = '!(function(){var d=function(){try{!function r(n){if((\"\"+n/n).length!==1||n%20===0){(function(){}).constructor(\"debugger\")()}else{debugger}r(++n)}(0)}catch(e){setTimeout(d,100)}};d()})();'

          for js_key, safe_key in mapping.items():
              if js_key in secrets_map:
                  # Anti-debug protection ko asli code ke sath fuse kar dena
                  protected_code = anti_debug_hook + secrets_map[js_key]
                  
                  # Layer 1: Characters ko obfuscated bytecode bytes array mein badalna
                  byte_array = [ord(c) ^ int(hashed_key[i % 64], 16) for i, c in enumerate(protected_code)]
                  
                  # Layer 2: Final machine buffer signature banana
                  encrypted_map[safe_key] = base64.b64encode(bytes(byte_array)).decode('utf-8')

          # Donon dynamic parts ko alag alag save karna taaki tamper na ho sakay
          final_payload = {
              'salt': dynamic_passphrase,
              'vault': encrypted_map
          }

          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(final_payload, f)
          
          print('Successfully applied high-security polymorphic payload.')
          "

      - name: Commit and Push data.json directly to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add data.json
          git commit -m "Auto-generated military secure data.json [skip ci]" || echo "No changes"
          git push origin main
