name: Compile JS to C# WebAssembly and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-csharp-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. C# (.NET) environment configuration setup karna
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 2. WASM build karne ke liye tools activate karna
      - name: Install WASM Tools workload
        run: dotnet workload install wasm-tools

      # 3. Python script ke zariye C# code automatic generate karna
      - name: Generate C# Project and Code
        env:
          SECRET_JSON: ${{ secrets.MY_SECRET_JS_CODE }}
        run: |
          python -c "
          import os, json
          secret_json_str = os.environ.get('SECRET_JSON', '{}')
          try:
              secrets_map = json.loads(secret_json_str)
          except Exception as e:
              print('Error: Secret JSON key invalid hai!', e); exit(1)

          mapping = {
              'soft': 'soft.js',
              'game_13': '13.js',
              'game_2': '2.js',
              'game_20': '20.js',
              'game_3': '3.js',
              'game_4': '4.js',
              'game_5': '5.js'
          }

          # C# Project File setup (.csproj)
          os.makedirs('LyraWasm', exist_ok=True)
          with open('LyraWasm/LyraWasm.csproj', 'w') as f:
              f.write('<Project Sdk=\"Microsoft.NET.Sdk.BlazorWebAssembly\">\n  <PropertyGroup>\n    <TargetFramework>net8.0</TargetFramework>\n    <ImplicitUsings>enable</ImplicitUsings>\n    <Nullable>enable</Nullable>\n  </PropertyGroup>\n</Project>\n')

          # C# File setup (.cs) jo JS code ko compile karegi
          csharp_functions = ''
          for func_name, js_key in mapping.items():
              if js_key in secrets_map:
                  js_content = secrets_map[js_key].replace('\\\\', '\\\\\\\\').replace('\\\"', '\\\\\\\"').replace('\"', '\\\"').replace('\n', ' ')
                  csharp_functions += f'    [JSInvokable]\n    public static void Load{func_name}()\n    {{\n        var js = \"var script = document.createElement(\\\"script\\\"); script.textContent = \\\"{js_content}\\\"; document.body.appendChild(script); script.remove();\";\n        JSRuntime.InvokeVoid(\"eval\", js);\n    }}\n\n'

          os.makedirs('LyraWasm/Pages', exist_ok=True)
          # Program.cs structure
          with open('LyraWasm/Program.cs', 'w') as f:
              f.write('using Microsoft.AspNetCore.Components.WebAssembly.Hosting;\nusing Microsoft.JSInterop;\nusing System.Runtime.InteropServices.JavaScript;\n\nnamespace LyraWasm;\n\npublic class Program\n{\n    private static IJSInProcessRuntime JSRuntime;\n    public static async Task Main(string[] args)\n    {\n        var builder = WebAssemblyHostBuilder.CreateDefault(args);\n        var host = builder.Build();\n        JSRuntime = (IJSInProcessRuntime)host.Services.GetRequiredService<IJSRuntime>();\n        await host.RunAsync();\n    }\n\n' + csharp_functions + '}')
          "

      # 4. C# Project ko production build (.wasm binary) mein compile karna
      - name: Publish C# Project to WASM
        run: dotnet publish LyraWasm/LyraWasm.csproj -c Release -o output_dist

      # 5. Deployment folder ready karna
      - name: Prepare HTML Files
        run: |
          mkdir -p pkg_deploy/game
          # Compiled binary contents transfer karna
          cp -r output_dist/wwwroot/_framework pkg_deploy/
          
          # Templates copy karna safely
          [ -f "soft.html" ] && cp soft.html pkg_deploy/soft.html
          [ -f "game/13.html" ] && cp game/13.html pkg_deploy/game/13.html
          [ -f "game/2.html" ] && cp game/2.html pkg_deploy/game/2.html
          [ -f "game/20.html" ] && cp game/20.html pkg_deploy/game/20.html
          [ -f "game/3-pro.html" ] && cp game/3-pro.html pkg_deploy/game/3-pro.html
          [ -f "game/4.html" ] && cp game/4.html pkg_deploy/game/4.html
          [ -f "game/5.html" ] && cp game/5.html pkg_deploy/game/5.html

      # 6. Target deploy branch par automatic files commit karna
      - name: Push Compiled App to Deploy Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          cd pkg_deploy
          git init
          git checkout -b deploy
          git add .
          git commit -m "Deploy stable C# WASM production app [skip ci]" || echo "No changes"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git
          git push origin deploy --force
