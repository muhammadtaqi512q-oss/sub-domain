name: Secure Binary JSON Obfuscation and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-binary-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Secret data ko binary (0s aur 1s) ke format mein tabdeel karna
      - name: Encrypt and Generate Binary data.json
        env:
          SECRET_JSON: ${{ secrets.MY_SECRET_JS_CODE }}
        run: |
          python -c "
          import os, json

          secret_json_str = os.environ.get('SECRET_JSON', '{}')
          try:
              secrets_map = json.loads(secret_json_str)
          except Exception as e:
              print('Error: Secret JSON sahi format mein nahi hai!', e); exit(1)

          binary_map = {}
          
          mapping = {
              'soft.js': 'soft',
              '13.js': '13',
              '2.js': '2',
              '20.js': '20',
              '3.js': '3',
              '4.js': '4',
              '5.js': '5'
          }

          # Har JS file ke characters ko 8-bit binary stream (010101) mein badalna
          for js_key, safe_key in mapping.items():
              if js_key in secrets_map:
                  raw_code = secrets_map[js_key]
                  # Har character ko machine code binary (0s aur 1s) mein convert karna
                  binary_string = ''.join(format(ord(char), '08b') for char in raw_code)
                  binary_map[safe_key] = binary_string

          os.makedirs('pkg_deploy', exist_ok=True)
          with open('pkg_deploy/data.json', 'w', encoding='utf-8') as f:
              json.dump(binary_map, f)
          
          print('Successfully obfuscated all scripts into absolute machine binary format.')
          "

      # HTML templates ko configure karna aur deployment folder ready karna
      - name: Prepare HTML Files
        run: |
          mkdir -p pkg_deploy/game
          [ -f "soft.html" ] && cp soft.html pkg_deploy/soft.html
          [ -f "game/13.html" ] && cp game/13.html pkg_deploy/game/13.html
          [ -f "game/2.html" ] && cp game/2.html pkg_deploy/game/2.html
          [ -f "game/20.html" ] && cp game/20.html pkg_deploy/game/20.html
          [ -f "game/3-pro.html" ] && cp game/3-pro.html pkg_deploy/game/3-pro.html
          [ -f "game/4.html" ] && cp game/4.html pkg_deploy/game/4.html
          [ -f "game/5.html" ] && cp game/5.html pkg_deploy/game/5.html

      # Code ko direct deploy branch par auto-commit karna
      - name: Push to Deploy Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          cd pkg_deploy
          git init
          git checkout -b deploy
          git add .
          git commit -m "Deploy binary engine architecture [skip ci]" || echo "No changes"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git
          git push origin deploy --force
