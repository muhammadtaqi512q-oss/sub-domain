name: Secure Binary JSON Obfuscation and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-binary-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Direct main branch par push karne ke liye full history token ke sath checkout karna zaroori hai
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 1. Secret data ko binary (0s aur 1s) ke format mein tabdeel karna
      - name: Encrypt and Generate Binary data.json
        env:
          SECRET_JSON: ${{ secrets.MY_SECRET_JS_CODE }}
        run: |
          python -c "
          import os, json

          secret_json_str = os.environ.get('SECRET_JSON', '{}')
          try:
              secrets_map = json.loads(secret_json_str)
          except Exception as e:
              print('Error: Secret JSON sahi format mein nahi hai!', e); exit(1)

          binary_map = {}
          
          mapping = {
              'soft.js': 'soft',
              '13.js': '13',
              '2.js': '2',
              '20.js': '20',
              '3.js': '3',
              '4.js': '4',
              '5.js': '5'
          }

          for js_key, safe_key in mapping.items():
              if js_key in secrets_map:
                  raw_code = secrets_map[js_key]
                  binary_string = ''.join(format(ord(char), '08b') for char in raw_code)
                  binary_map[safe_key] = binary_string

          # Direct root folder ke andar data.json banana bina pkg_deploy ke
          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(binary_map, f)
          
          print('Successfully obfuscated all scripts into absolute machine binary format.')
          "

      # 2. data.json ko direct 'main' branch par automatic push/commit karna
      - name: Commit and Push data.json directly to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # Check karna agar file generate hui hai aur koi tabdeeli hai
          git add data.json
          
          # [skip ci] likhna zaroori hai taaki yeh commit dubara workflow ko loop mein start na kare
          git commit -m "Auto-generated binary data.json [skip ci]" || echo "No changes to commit"
          git push origin main
