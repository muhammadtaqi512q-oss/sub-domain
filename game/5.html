<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYRA GAME BUILDER — Created by MUHAMMAD TAQI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',sans-serif;background:radial-gradient(circle at 15% 10%,#1e1b4b 0%,#0b1020 45%,#04060d 100%);background-attachment:fixed;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden}
body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none}
body::before{width:55vw;height:55vw;top:-20%;left:-15%;background:radial-gradient(circle,rgba(99,102,241,.55) 0%,transparent 70%);animation:floatA 22s ease-in-out infinite}
body::after{width:55vw;height:55vw;bottom:-20%;right:-15%;background:radial-gradient(circle,rgba(168,85,247,.45) 0%,transparent 70%);animation:floatB 26s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(8%,12%)}}
@keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(-10%,-8%)}}
#lyraRoot{position:relative;z-index:1;width:100%;max-width:780px}
.screen{display:none}
.screen.active{display:block;animation:slideIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.card{background:rgba(11,18,35,.72);border:1px solid rgba(139,143,255,.18);border-radius:28px;padding:40px 34px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 40px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.02) inset;text-align:center;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#6366f1,#a855f7,transparent);opacity:.8}
.badge{display:inline-block;font-size:10px;letter-spacing:.28em;padding:8px 16px;border-radius:100px;background:linear-gradient(90deg,rgba(99,102,241,.25),rgba(168,85,247,.25));border:1px solid rgba(139,143,255,.3);font-weight:800;color:#c7d2fe}
h1{font-family:'Cinzel',serif;font-size:3rem;font-weight:900;line-height:1.02;letter-spacing:-.02em;margin:22px 0 10px}
h1 span{background:linear-gradient(135deg,#818cf8 0%,#c084fc 50%,#f472b6 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.byline{color:#94a3b8;font-size:.92rem;margin-bottom:32px}
.byline b{color:#fff;letter-spacing:.06em}
h2{font-family:'Cinzel',serif;font-size:1.7rem;font-weight:800;letter-spacing:.01em;margin:14px 0 8px}
.sub{color:#94a3b8;font-size:.9rem;line-height:1.65;margin-bottom:26px}
.step{display:inline-block;font-size:9px;letter-spacing:.28em;font-weight:800;color:#a5b4fc;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.3);padding:5px 12px;border-radius:100px;margin-bottom:6px}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:14px;letter-spacing:.08em;padding:18px 28px;border-radius:16px;color:#fff;background:linear-gradient(135deg,#6366f1 0%,#a855f7 100%);box-shadow:0 15px 35px rgba(99,102,241,.4),inset 0 1px 0 rgba(255,255,255,.15);transition:transform .18s,box-shadow .18s;margin-top:8px}
.cta:hover{transform:translateY(-2px);box-shadow:0 20px 45px rgba(99,102,241,.55),inset 0 1px 0 rgba(255,255,255,.2)}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:1;font-family:inherit;font-weight:700;font-size:12px;letter-spacing:.06em;padding:14px 20px;border-radius:13px;color:#e2e8f0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:.18s}
.ghost:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:16px;background:transparent;border:none;color:#94a3b8;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;padding:8px 12px;border-radius:8px;transition:.18s}
.back:hover{color:#fff;background:rgba(255,255,255,.05)}
.version{font-size:10px;color:#475569;letter-spacing:.2em;margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,.06)}
.game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
@media (max-width:700px){.game-grid{grid-template-columns:repeat(2,1fr)}}
.game-card{padding:20px 12px;background:linear-gradient(160deg,rgba(30,41,59,.7),rgba(15,23,42,.5));border:1.5px solid rgba(139,143,255,.18);border-radius:18px;cursor:pointer;transition:.24s cubic-bezier(.2,.8,.2,1);text-align:center;position:relative;overflow:hidden}
.game-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(99,102,241,.25),transparent 60%);opacity:0;transition:.3s}
.game-card:hover{border-color:rgba(139,143,255,.6);transform:translateY(-6px) scale(1.02);box-shadow:0 25px 50px rgba(99,102,241,.3)}
.game-card:hover::before{opacity:1}
.game-icon{font-size:40px;line-height:1;margin-bottom:8px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));position:relative;z-index:1}
.game-card h3{font-family:'Cinzel',serif;font-size:.9rem;letter-spacing:.1em;color:#fff;margin-bottom:4px;position:relative;z-index:1;line-height:1.2}
.game-card p{font-size:9.5px;color:#94a3b8;line-height:1.4;position:relative;z-index:1}
.chosen-game{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:100px;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.35);margin-bottom:22px;font-weight:800;letter-spacing:.15em;font-size:12px;color:#c7d2fe}
.chosen-game .icon{font-size:20px}
label{display:block;text-align:left;font-size:10px;letter-spacing:.22em;font-weight:800;color:#94a3b8;margin:18px 0 8px}
.inp{width:100%;background:#050914;border:1.5px solid #1e293b;border-radius:12px;padding:15px 16px;color:#fff;font-size:14px;font-family:inherit;outline:none;transition:.2s}
.inp:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.18)}
.hash-wrap{display:flex;align-items:center;background:#050914;border:1.5px solid #1e293b;border-radius:12px;overflow:hidden;transition:.2s}
.hash-wrap:focus-within{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.18)}
.hash-wrap span{padding-left:16px;color:#a855f7;font-weight:900;font-size:14px}
.hash-wrap .inp{border:none;background:transparent;box-shadow:none!important}
.grid-options{display:flex;gap:8px}
.grid-btn{flex:1;padding:13px 8px;border-radius:11px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);color:#e2e8f0;cursor:pointer;font-family:inherit;font-weight:800;font-size:13px;letter-spacing:.04em;transition:.18s}
.grid-btn:hover{background:rgba(255,255,255,.12)}
.grid-btn.active{background:linear-gradient(135deg,#6366f1,#a855f7);border-color:#a855f7;color:#fff;box-shadow:0 8px 20px rgba(99,102,241,.4)}
.preview{margin-top:20px;padding:12px 16px;background:#020617;border:1px solid rgba(16,185,129,.35);border-radius:10px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#10b981;word-break:break-all;text-align:left;line-height:1.6;min-height:38px;opacity:.75}
.preview .hash{color:#c084fc;font-weight:800}
.preview .domain{color:#f8fafc}
.tick{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#fff;margin:0 auto 16px;box-shadow:0 15px 35px rgba(16,185,129,.5),inset 0 2px 0 rgba(255,255,255,.2);animation:popIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes popIn{0%{transform:scale(0)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
.url-display{margin:18px 0 24px;padding:16px;background:#020617;border:1px solid rgba(16,185,129,.4);border-radius:12px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#10b981;word-break:break-all;line-height:1.7;text-align:left}
.url-display .hash{color:#c084fc;font-weight:800}
.url-display .domain{color:#f8fafc}
.rows{display:flex;gap:10px;margin-top:12px}
.rows .ghost{flex:1}
.meta{font-size:11px;color:#64748b;line-height:1.7;margin-top:6px}
@media (max-width:520px){h1{font-size:2.2rem}.card{padding:30px 22px;border-radius:22px}.game-icon{font-size:36px}}
</style>
</head>
<body>

<script type="text/template" id="tpl-memory">
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>%%GAME_NAME%% — LYRA</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Plus Jakarta Sans',sans-serif;background:radial-gradient(circle at center,#1b2838 0%,#0d121d 100%);color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;padding:14px;overflow:hidden;user-select:none;-webkit-user-select:none}header{width:100%;max-width:700px;margin:0 auto 10px;padding:12px 18px;background:rgba(22,32,50,.75);backdrop-filter:blur(16px);border:1px solid rgba(255,215,0,.15);border-radius:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 20px 50px rgba(0,0,0,.5);flex-wrap:wrap;gap:10px}.brand{display:flex;align-items:center;gap:10px}.brand-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#a855f7);display:flex;align-items:center;justify-content:center;font-size:20px}.brand h1{font-family:'Cinzel',serif;font-size:1.1rem;font-weight:800;letter-spacing:.08em;color:#fbbf24}.brand p{font-size:10px;color:#94a3b8;letter-spacing:.15em;text-transform:uppercase}.stats{display:flex;gap:14px}.stat{text-align:center}.stat-label{font-size:9px;color:#94a3b8;letter-spacing:.15em;text-transform:uppercase;display:block;margin-bottom:2px}.stat-value{font-family:'Cinzel',serif;font-size:1.15rem;font-weight:800;color:#fbbf24;font-variant-numeric:tabular-nums}main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0}#grid{display:grid;gap:8px;width:100%;max-width:min(94vw,540px);margin:0 auto}.card{aspect-ratio:1;border-radius:14px;cursor:pointer;position:relative;transition:transform .3s,background .3s;background:linear-gradient(135deg,#1e293b,#0f172a);border:2px solid rgba(139,143,255,.3);display:flex;align-items:center;justify-content:center;font-size:clamp(28px,7vw,48px);box-shadow:inset 0 2px 0 rgba(255,255,255,.1),0 4px 12px rgba(0,0,0,.4)}.card:hover{transform:translateY(-2px);border-color:rgba(139,143,255,.6)}.card.flipped{background:linear-gradient(135deg,#334155,#1e293b);border-color:rgba(251,191,36,.6)}.card.matched{background:linear-gradient(135deg,#10b981,#059669);border-color:#10b981;cursor:default;box-shadow:0 0 20px rgba(16,185,129,.5)}.card.matched:hover{transform:none}.card-front{opacity:0;transition:opacity .2s}.card.flipped .card-front,.card.matched .card-front{opacity:1}.card-back{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#6366f1;font-size:clamp(20px,5vw,32px);opacity:1;transition:opacity .2s}.card.flipped .card-back,.card.matched .card-back{opacity:0}.controls{width:100%;max-width:700px;margin:10px auto 0;padding:10px 14px;background:rgba(22,32,50,.75);border:1px solid rgba(255,215,0,.15);border-radius:14px;display:flex;gap:8px;justify-content:center}button{font-family:inherit;font-weight:700;font-size:12px;letter-spacing:.05em;padding:10px 18px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#e2e8f0;cursor:pointer;transition:.18s}button:hover{background:rgba(255,255,255,.15);transform:translateY(-1px)}button.primary{background:linear-gradient(135deg,#f59e0b,#d97706);border-color:#fbbf24;color:#0f172a;box-shadow:0 8px 20px rgba(245,158,11,.3)}.win-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.win-overlay.show{display:flex}.win-card{background:rgba(15,23,42,.95);border:2px solid rgba(251,191,36,.5);border-radius:24px;padding:40px 32px;max-width:420px;width:100%;text-align:center;animation:popIn .5s}@keyframes popIn{0%{transform:scale(.7);opacity:0}80%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}.win-icon{width:80px;height:80px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:40px}.win-card h2{font-family:'Cinzel',serif;font-size:1.8rem;font-weight:900;color:#fbbf24;margin-bottom:8px}.win-card p{font-size:13px;color:#94a3b8;margin-bottom:24px}.win-stats{display:flex;justify-content:center;gap:24px;margin-bottom:24px;padding:16px;background:rgba(255,255,255,.03);border-radius:12px}.win-stat-value{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:900;color:#fbbf24;display:block}.win-stat-label{font-size:10px;color:#94a3b8;letter-spacing:.15em;text-transform:uppercase}.footer{width:100%;max-width:700px;margin:10px auto 0;text-align:center;font-size:10px;color:#475569;letter-spacing:.15em;text-transform:uppercase}@media(max-width:500px){header{padding:10px 14px}.brand h1{font-size:.95rem}.stat-value{font-size:1rem}button{font-size:11px;padding:8px 12px}}</style></head>
<body><header><div class="brand"><div class="brand-icon">🃏</div><div><h1>%%GAME_NAME%%</h1><p>#%%GAME_ID%% · @%%USERNAME%%</p></div></div><div class="stats"><div class="stat"><span class="stat-label">Moves</span><span class="stat-value" id="movesEl">0</span></div><div class="stat"><span class="stat-label">Time</span><span class="stat-value" id="timeEl">0:00</span></div><div class="stat"><span class="stat-label">Pairs</span><span class="stat-value" id="pairsEl">0/0</span></div></div></header>
<main><div id="grid"></div></main>
<div class="controls"><button class="primary" id="newBtn">🔄 New Game</button></div>
<div class="footer">LYRA GAME BUILDER · Created by MUHAMMAD TAQI</div>
<div class="win-overlay" id="winOverlay"><div class="win-card"><div class="win-icon">🎉</div><h2>YOU WIN!</h2><p>All pairs matched!</p><div class="win-stats"><div><span class="win-stat-value" id="winMoves">0</span><span class="win-stat-label">Moves</span></div><div><span class="win-stat-value" id="winTime">0:00</span><span class="win-stat-label">Time</span></div></div><button class="primary" id="playAgainBtn">Play Again</button></div></div>
<script>(function(){var CFG="%%CONFIG_VALUE%%";var PAIRS=parseInt(CFG,10)||12;if([8,12,16].indexOf(PAIRS)===-1)PAIRS=12;var EMO=['🍎','🍌','🍇','🍓','🍒','🍑','🍊','🥝','🍍','🥥','🍉','🍋','🥑','🍆','🥕','🌽','🍄','🌶️','🍔','🍕','🍟','🌮','🍩','🍪'];var deck=[],flipped=[],matched=0,moves=0,startTime=null,ti=null,locked=false,ac=null;
function tone(f,d){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(d||.1));o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.1))}catch(e){}}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function newGame(){matched=0;moves=0;flipped=[];locked=false;if(ti){clearInterval(ti);ti=null}startTime=null;document.getElementById('movesEl').textContent='0';document.getElementById('timeEl').textContent='0:00';document.getElementById('pairsEl').textContent='0/'+PAIRS;document.getElementById('winOverlay').classList.remove('show');var picked=shuf(EMO.slice()).slice(0,PAIRS);deck=[];picked.forEach(function(e){deck.push({emoji:e,flipped:false,matched:false});deck.push({emoji:e,flipped:false,matched:false})});shuf(deck);var cols=4;var g=document.getElementById('grid');g.style.gridTemplateColumns='repeat('+cols+',1fr)';g.innerHTML='';deck.forEach(function(c,i){var el=document.createElement('div');el.className='card';el.dataset.idx=i;el.innerHTML='<span class="card-front">'+c.emoji+'</span><span class="card-back">?</span>';el.addEventListener('click',function(){flip(i)});g.appendChild(el)})}
function startTimer(){if(startTime)return;startTime=Date.now();ti=setInterval(function(){var e=Math.floor((Date.now()-startTime)/1000);document.getElementById('timeEl').textContent=Math.floor(e/60)+':'+(e%60<10?'0':'')+(e%60)},250)}
function fmt(){if(!startTime)return'0:00';var e=Math.floor((Date.now()-startTime)/1000);return Math.floor(e/60)+':'+(e%60<10?'0':'')+(e%60)}
function flip(idx){if(locked||deck[idx].flipped||deck[idx].matched)return;if(flipped.length>=2)return;if(!startTime)startTimer();var el=document.querySelectorAll('.card')[idx];deck[idx].flipped=true;el.classList.add('flipped');tone(600,.08);flipped.push(idx);if(flipped.length===2){moves++;document.getElementById('movesEl').textContent=moves;locked=true;var i1=flipped[0],i2=flipped[1];setTimeout(function(){if(deck[i1].emoji===deck[i2].emoji){deck[i1].matched=deck[i2].matched=true;document.querySelectorAll('.card')[i1].classList.add('matched');document.querySelectorAll('.card')[i2].classList.add('matched');matched++;document.getElementById('pairsEl').textContent=matched+'/'+PAIRS;tone(880,.15);if(matched===PAIRS){if(ti){clearInterval(ti);ti=null}[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,.25)},i*100)});setTimeout(function(){document.getElementById('winMoves').textContent=moves;document.getElementById('winTime').textContent=fmt();document.getElementById('winOverlay').classList.add('show')},400)}}else{deck[i1].flipped=deck[i2].flipped=false;document.querySelectorAll('.card')[i1].classList.remove('flipped');document.querySelectorAll('.card')[i2].classList.remove('flipped');tone(220,.15)}flipped=[];locked=false},700)}}
document.getElementById('newBtn').addEventListener('click',newGame);document.getElementById('playAgainBtn').addEventListener('click',newGame);newGame()})();<\/script></body></html>

function genMaze(n){var grid=[];for(var y=0;y<n;y++){var row=[];for(var x=0;x<n;x++)row.push({wall:true,visited:false});grid.push(row)}var stack=[],cur={x:1,y:1};grid[1][1].wall=false;grid[1][1].visited=true;stack.push(cur);while(stack.length){var ns=[],dirs=[[0,-2],[0,2],[-2,0],[2,0]];dirs.forEach(function(d){var nx=cur.x+d[0],ny=cur.y+d[1];if(nx>0&&ny>0&&nx<n-1&&ny<n-1&&!grid[ny][nx].visited)ns.push({x:nx,y:ny,dx:d[0],dy:d[1]})});if(ns.length){var next=ns[Math.floor(Math.random()*ns.length)];grid[next.y][next.x].wall=false;grid[next.y][next.x].visited=true;grid[cur.y+next.dy/2][cur.x+next.dx/2].wall=false;stack.push(next);cur=next}else{stack.pop();if(stack.length)cur=stack[stack.length-1]}}grid[1][1].wall=false;grid[n-2][n-2].wall=false;return grid}

<script>(function(){var CFG="%%CONFIG_VALUE%%";var SIZE=parseInt(CFG,10)||4;if([4,5].indexOf(SIZE)===-1)SIZE=4;var grid=[],score=0,best=parseInt(localStorage.getItem('lyra2048b_'+SIZE)||'0',10),won=false,continued=false;
function init(){grid=[];for(var y=0;y<SIZE;y++)grid.push(new Array(SIZE).fill(0));score=0;won=false;continued=false;addTile();addTile();render()}
function addTile(){var e=[];for(var y=0;y<SIZE;y++)for(var x=0;x<SIZE;x++)if(grid[y][x]===0)e.push({x:x,y:y});if(!e.length)return;var p=e[Math.floor(Math.random()*e.length)];grid[p.y][p.x]=Math.random()<.9?2:4}

<style>@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Plus Jakarta Sans',sans-serif;background:radial-gradient(circle at center,#1b2838 0%,#0d121d 100%);color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;padding:14px;overflow:hidden;user-select:none;-webkit-user-select:none}header{width:100%;max-width:700px;margin:0 auto 10px;padding:12px 18px;background:rgba(22,32,50,.75);backdrop-filter:blur(16px);border:1px solid rgba(255,215,0,.15);border-radius:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 20px 50px rgba(0,0,0,.5);flex-wrap:wrap;gap:10px}.brand{display:flex;align-items:center;gap:10px}.brand-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#a855f7);display:flex;align-items:center;justify-content:center;font-size:20px}.brand h1{font-family:'Cinzel',serif;font-size:1.1rem;font-weight:800;letter-spacing:.08em;color:#fbbf24}.brand p{font-size:10px;color:#94a3b8;letter-spacing:.15em;text-transform:uppercase}.stats{display:flex;gap:14px}.stat{text-align:center}.stat-label{font-size:9px;color:#94a3b8;letter-spacing:.15em;text-transform:uppercase;display:block;margin-bottom:2px}.stat-value{font-family:'Cinzel',serif;font-size:1.15rem;font-weight:800;color:#fbbf24;font-variant-numeric:tabular-nums}main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0}#grid{display:grid;gap:6px;background:#0f172a;padding:10px;border-radius:14px;border:3px solid rgba(251,191,36,.4);box-shadow:0 20px 50px rgba(0,0,0,.6);width:min(90vw,440px);aspect-ratio:1}.cell{border-radius:8px;cursor:pointer;transition:.2s;background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 0 20px rgba(251,191,36,.6),inset 0 2px 0 rgba(255,255,255,.3);border:2px solid rgba(251,191,36,.8)}.cell:hover{transform:scale(1.05)}.cell.off{background:linear-gradient(135deg,#1e293b,#0f172a);box-shadow:inset 0 2px 4px rgba(0,0,0,.6);border-color:rgba(255,255,255,.08)}.controls{width:100%;max-width:700px;margin:10px auto 0;padding:10px 14px;background:rgba(22,32,50,.75);border:1px solid rgba(255,215,0,.15);border-radius:14px;display:flex;gap:8px;justify-content:center}button.primary{font-family:inherit;font-weight:700;font-size:12px;padding:10px 18px;border-radius:10px;border:1px solid #fbbf24;background:linear-gradient(135deg,#f59e0b,#d97706);color:#0f172a;cursor:pointer;box-shadow:0 8px 20px rgba(245,158,11,.3)}button.primary:hover{transform:translateY(-1px)}.win-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.win-overlay.show{display:flex}.win-card{background:rgba(15,23,42,.95);border:2px solid rgba(251,191,36,.5);border-radius:24px;padding:40px 32px;max-width:420px;width:100%;text-align:center;animation:popIn .5s}@keyframes popIn{0%{transform:scale(.7);opacity:0}80%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}.win-icon{width:80px;height:80px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:40px}.win-card h2{font-family:'Cinzel',serif;font-size:1.8rem;font-weight:900;color:#fbbf24;margin-bottom:8px}.win-card p{font-size:13px;color:#94a3b8;margin-bottom:24px}.win-stats{display:flex;justify-content:center;gap:24px;margin-bottom:24px;padding:16px;background:rgba(255,255,255,.03);border-radius:12px}.win-stat-value{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:900;color:#fbbf24;display:block}.win-stat-label{font-size:10px;color:#94a3b8;letter-spacing:.15em;text-transform:uppercase}.footer{width:100%;max-width:700px;margin:10px auto 0;text-align:center;font-size:10px;color:#475569;letter-spacing:.15em;text-transform:uppercase}@media(max-width:500px){ <script>(function(){var CFG="%%CONFIG_VALUE%%";var SIZE=parseInt(CFG,10)||4;if([4,5,6].indexOf(SIZE)===-1)SIZE=4;var grid=[],moves=0,won=false;
function init(){grid=[];do{grid=[];for(var y=0;y<SIZE;y++){var r=[];for(var x=0;x<SIZE;x++)r.push(Math.random()<.5);grid.push(r)}}while(allOff());moves=0;won=false;render();document.getElementById('winOverlay').classList.remove('show')}
function allOff(){for(var y=0;y<SIZE;y++)for(var x=0;x<SIZE;x++)if(grid[y][x])return false;return true}
function toggle(x,y){if(x<0||y<0||x>=SIZE||y>=SIZE)return;grid[y][x]=!grid[y][x]}
function click(x,y){if(won)return;toggle(x,y);toggle(x-1,y);toggle(x+1,y);toggle(x,y-1);toggle(x,y+1);moves++;render();if(allOff()){won=true;setTimeout(function(){document.getElementById('winMoves').textContent=moves;document.getElementById('winOverlay').classList.add('show')},300)}}
function render(){var el=document.getElementById('grid');el.style.gridTemplateColumns='repeat('+SIZE+',1fr)';el.style.gridTemplateRows='repeat('+SIZE+',1fr)';el.innerHTML='';for(var y=0;y<SIZE;y++)for(var x=0;x<SIZE;x++){(function(xx,yy){var c=document.createElement('div');c.className='cell'+(grid[yy][xx]?'':' off');c.addEventListener('click',function(){click(xx,yy)});el.appendChild(c)})(x,y)}document.getElementById('movesEl').textContent=moves}
document.getElementById('newBtn').addEventListener('click',init);document.getElementById('playAgainBtn').addEventListener('click',init);init()})();<\/script></body></html>
</script>

el',serif;font-weight:900;color:rgba(255,255,255,.9);user-select:none;box-shadow:inset 0 4px 8px rgba(255,255,255,.2),inset 0 -4px 8px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.2)}.pad-0{background:linear-gradient(135deg,#ef4444,#991b1b)}.pad-1{background:linear-gradient(135deg,#3b82f6,#1e40af)}.pad-2{background:linear-gradient(135deg,#10b981,#065f46)}.pad-3{background:linear-gradient(135deg,#fbbf24,#d97706)}.pad.active{transform:scale(.94);box-shadow:inset 0 0 40px rgba(255,255,255,.7),0 0 30px currentColor;filter:brightness(1.6)}.pad.disabled{cursor:not-allowed;opacity:.5}.status-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(15,23,42,.95);border:2px solid rgba(251,191,36,.5);border-radius:14px;padding:10px 20px;font-family:'Cinzel',serif;font-size:14px;font-weight:900;color:#fbbf24;letter-spacing:.1em;z-index:10;pointer-events:none;white-space:nowrap}.controls{width:100%;max-width:700px;margin:10px auto 0;padding:10px 14px;background:rgba(22,32,50,.75);border:1px solid rgba(255,215,0,.15);border-radius:14px;display:flex;gap:8px;justify-content:center}button.primary{font-family:inherit;font-weight:700;font-size:12px;padding:10px 18px;border-radius:10px;border:1px solid #fbbf24;background:linear-gradient(135deg,#f59e0b,#d97706);color:#0f172a;cursor:pointer;box-shadow:0 8px 20px rgba(245,158,11,.3)}button.primary:hover{transform:translateY(-1px)}.win-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.win-overlay.show{display:flex}.win-card{background:rgba(15,23,42,.95);border:2px solid rgba(251,191,36,.5);border-radius:24px;padding:40px 32px;max-width:420px;width:100%;text-align:center;animation:popIn .5s}@keyframes popIn{0%{transform:scale(.7);opacity:0}80%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}.win-icon{width:80px;height:80px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,#ef4444,#991b1b);display:flex;align-items:center;justify-content:center;font-size:40px}.win-card h2{font-family:'Cinzel',serif;font-size:1.8rem;font-weight:900;color:#fbbf24;margin-bottom:8px}.win-card p{font-size:13px;color:#94a3b8;margin-bottom:24px}.win-stats{display:flex;justify-content:center;gap:24px;margin-bottom:24px;padding:16px;background:rgba(255,255,255,.03);border-radius:12px}.win-stat-value{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:900;color:#fbbf24;display:block}.win-stat-label{font-size:10px;color:#94a3b8;letter-spacing:.15em;text-transform:uppercase}.footer{width:100%;max-width:700px;margin:10px auto 0;text-align:center;font-size:10px;color:#475569;letter-spacing:.15em;text-transform:uppercase}@media(max-width:500px){header{padding:10px 14px}.brand h1{font-size:.95rem}.pad{font-size:24px}}</style></head>

<main><div class="simon-board" id="board"><div class="pad pad-0" data-i="0"></div><div class="pad pad-1" data-i="1"></div><div class="pad pad-2" data-i="2"></div><div class="pad pad-3" data-i="3"></div><div class="status-badge" id="status">WATCH</div></div></main>

<script>(function(){var CFG="%%CONFIG_VALUE%%";var SPEED_MAP={slow:1.6,normal:1.0,fast:.65};var SPEED=SPEED_MAP[CFG]||1.0;var sequence=[],playerIdx=0,playing=false,level=0,best=parseInt(localStorage.getItem('lyraSimonBest')||'0',10),ac=null;var TONES=[329.63,261.63,220.0,164.81];
function beep(i,d){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=TONES[i];g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(d||.3));o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.3))}catch(e){}}
function flash(i,d){var p=document.querySelector('.pad[data-i="'+i+'"]');p.classList.add('active');beep(i,d);setTimeout(function(){p.classList.remove('active')},(d||.3)*1000)}
function updateStats(){document.getElementById('levelEl').textContent=level;if(level>best){best=level;localStorage.setItem('lyraSimonBest',best)}document.getElementById('bestEl').textContent=best}
function setStatus(t){document.getElementById('status').textContent=t}
function playSeq(){playing=false;setStatus('WATCH');document.querySelectorAll('.pad').forEach(function(p){p.classList.add('disabled')});var i=0;var interval=600*SPEED,delay=600*SPEED;setTimeout(function tick(){if(i>=sequence.length){setTimeout(function(){playing=true;setStatus('YOUR TURN');document.querySelectorAll('.pad').forEach(function(p){p.classList.remove('disabled')})},400);return}flash(sequence[i],.35*SPEED);i++;setTimeout(tick,interval)},delay)}
function nextRound(){level++;sequence.push(Math.floor(Math.random()*4));playerIdx=0;updateStats();setTimeout(playSeq,500)}

<!-- ========== LYRA GAME BUILDER LOGIC ========== -->
<script>
(function(){
  'use strict';
  
  var GAMES = {
    memory: { icon: '🃏', label: 'MEMORY', sub: 'Flip & match pairs' },
    maze:   { icon: '🌀', label: 'MAZE', sub: 'Escape the maze' },
    '2048': { icon: '🔢', label: '2048', sub: 'Merge tiles to 2048' },
    lights: { icon: '💡', label: 'LIGHTS OUT', sub: 'Toggle all lights off' },
    simon:  { icon: '🎵', label: 'SIMON SAYS', sub: 'Repeat the sequence' }
  };
  
  var GAME_CONFIGS = {
    memory: { fields: [
      { type: 'buttons', id: 'pairs', label: 'NUMBER OF PAIRS', options: [8,12,16], default: 12 }
    ]},
    maze: { fields: [
      { type: 'buttons', id: 'difficulty', label: 'DIFFICULTY', options: ['easy','medium','hard'], default: 'medium', prettify: true }
    ]},
    '2048': { fields: [
      { type: 'buttons', id: 'size', label: 'GRID SIZE', options: [4,5], default: 4, suffix: '×' }
    ]},
    lights: { fields: [
      { type: 'buttons', id: 'size', label: 'GRID SIZE', options: [4,5,6], default: 4, suffix: '×' }
    ]},
    simon: { fields: [
      { type: 'buttons', id: 'speed', label: 'SPEED', options: ['slow','normal','fast'], default: 'normal', prettify: true }
    ]}
  };
  
  var chosenGame = null;
  var finalShareUrl = '';
  var finalGameID = '';
  var finalUsername = '';
  var finalGameName = '';
  
  function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function slugify(s){ return String(s||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
  function prettify(slug){ if(!slug) return ''; return slug.split('-').map(function(w){ return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase(); }).join(' '); }
  function prettierName(raw){ return String(raw||'').replace(/\s+/g,' ').trim(); }
  function getBaseUrl(){ return location.href.split('#')[0].split('?')[0]; }
  function setScreen(html){ document.getElementById('lyraRoot').innerHTML = html; }
  
  function loadTemplate(gametype){
    var el = document.getElementById('tpl-' + gametype);
    if (!el) return '';
    return el.textContent.replace(/<\\\//g, '</');
  }
  
  function buildGame(gametype, gameName, gameID, username, config){
    var tpl = loadTemplate(gametype);
    if (!tpl) return '';
    config = config || {};
    var configValue = config.value || '';
    return tpl
      .split('%%GAME_NAME%%').join(escHtml(gameName))
      .split('%%GAME_ID%%').join(escHtml(gameID))
      .split('%%USERNAME%%').join(escHtml(username))
      .split('%%CONFIG_VALUE%%').join(escHtml(configValue));
  }
  
  function parseRoute(){
    var rawHash = location.hash.slice(1);
    if (!rawHash) return null;
    var pipeParts = rawHash.split('|');
    var mainHash = pipeParts[0];
    try { mainHash = decodeURIComponent(mainHash); } catch(e){}
    var parts = mainHash.split('+');
    if (parts.length < 2) return null;
    var gameID = parts[0].trim();
    var username = parts[1].trim();
    if (!gameID || !username) return null;
    var firstDash = gameID.indexOf('-');
    var gametype, nameSlug;
    if (firstDash > 0){ gametype = gameID.substring(0, firstDash).toLowerCase(); nameSlug = gameID.substring(firstDash+1); }
    else { gametype = gameID.toLowerCase(); nameSlug = ''; }
    if (!GAMES[gametype]) return null;
    var gameName = prettify(nameSlug) || GAMES[gametype].label;
    var config = {};
    config.value = pipeParts[1] ? decodeURIComponent(pipeParts[1]) : '';
    return { gametype: gametype, gameID: gameID, username: username, gameName: gameName, nameSlug: nameSlug, config: config };
  }
  
  function openGameInIframe(route){
    var html = buildGame(route.gametype, route.gameName, route.gameID, route.username, route.config);
    if (!html){ renderLanding(); return; }
    document.title = route.gameName + ' — LYRA GAME BUILDER';
    document.body.innerHTML = '';
    document.body.style.cssText = 'margin:0;padding:0;overflow:hidden;background:#020617;display:block;min-height:100vh;';
    var iframe = document.createElement('iframe');
    iframe.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:none;display:block;';
    iframe.setAttribute('allow', 'autoplay; fullscreen');
    document.body.appendChild(iframe);
    iframe.srcdoc = html;
  }
  
  function renderLanding(){
    setScreen(
      '<div class="screen active"><div class="card">' +
        '<div class="badge">◆ POWERED BY TAQI CLOUD</div>' +
        '<h1>LYRA <span>GAME</span> BUILDER</h1>' +
        '<p class="byline">Crafted by <b>MUHAMMAD TAQI</b></p>' +
        '<button class="cta" onclick="window.__lyraGoChoose()">◈ CREATE YOUR GAME</button>' +
        '<div class="version">v4.0 · 5 PUZZLE GAMES</div>' +
      '</div></div>'
    );
  }
  
  function renderChoose(){
    var cards = Object.keys(GAMES).map(function(key){
      var g = GAMES[key];
      return '<div class="game-card" onclick="window.__lyraSelectGame(\'' + key + '\')">' +
        '<div class="game-icon">' + g.icon + '</div>' +
        '<h3>' + g.label + '</h3>' +
        '<p>' + g.sub + '</p>' +
      '</div>';
    }).join('');
    setScreen(
      '<div class="screen active"><div class="card">' +
        '<div class="step">STEP 1 OF 3</div>' +
        '<h2>CHOOSE YOUR GAME</h2>' +
        '<p class="sub">5 puzzle game engines available</p>' +
        '<div class="game-grid">' + cards + '</div>' +
        '<button class="back" onclick="window.__lyraGoLanding()">← BACK</button>' +
      '</div></div>'
    );
  }
  
  function renderConfigFields(gametype){
    var cfg = GAME_CONFIGS[gametype];
    if (!cfg) return '';
    return cfg.fields.map(function(f){
      if (f.type === 'buttons'){
        var btns = f.options.map(function(o){
          var display = f.suffix ? (o + f.suffix) : (f.prettify ? (o.charAt(0).toUpperCase()+o.slice(1)) : o);
          var active = (o == f.default) ? ' active' : '';
          return '<button type="button" class="grid-btn' + active + '" data-field="' + f.id + '" data-value="' + o + '">' + display + '</button>';
        }).join('');
        return '<label>' + f.label + '</label><div class="grid-options">' + btns + '</div>';
      }
      return '';
    }).join('');
  }
  
  function renderDetails(gametype){
    var g = GAMES[gametype];
    setScreen(
      '<div class="screen active"><div class="card">' +
        '<div class="step">STEP 2 OF 3</div>' +
        '<h2>NAME YOUR GAME</h2>' +
        '<p class="sub">Give your game a name and choose a username</p>' +
        '<div class="chosen-game"><span class="icon">' + g.icon + '</span><span>' + g.label + '</span></div>' +
        '<label>GAME NAME</label>' +
        '<input class="inp" id="inGameName" maxlength="30" placeholder="e.g. MY ' + g.label + ' ARENA">' +
        '<label>USERNAME</label>' +
        '<div class="hash-wrap"><span>@</span><input class="inp" id="inUsername" maxlength="20" placeholder="e.g. taqi"></div>' +
        renderConfigFields(gametype) +
        '<div class="preview" id="urlPreview">Fill in the fields to preview your URL</div>' +
        '<button class="cta" onclick="window.__lyraPublish()">🚀 PUBLISH GAME</button>' +
        '<button class="back" onclick="window.__lyraGoChoose()">← BACK</button>' +
      '</div></div>'
    );
    var gi = document.getElementById('inGameName');
    var un = document.getElementById('inUsername');
    var pv = document.getElementById('urlPreview');
    var btns = document.querySelectorAll('.grid-btn');
    for (var i=0; i<btns.length; i++){
      (function(btn){
        btn.addEventListener('click', function(){
          var field = btn.dataset.field;
          var sameField = document.querySelectorAll('[data-field="' + field + '"]');
          for (var j=0; j<sameField.length; j++) sameField[j].classList.remove('active');
          btn.classList.add('active');
          updatePreview();
        });
      })(btns[i]);
    }
    function updatePreview(){
      var name = slugify(gi.value);
      var user = un.value.trim().replace(/\s+/g, '');
      if (!name || !user){
        pv.innerHTML = 'Fill in the fields to preview your URL';
        pv.style.opacity = '.75';
        return;
      }
      var gid = gametype + '-' + name;
      var suffix = '';
      var cfg = GAME_CONFIGS[gametype];
      if (cfg){
        var vals = [];
        cfg.fields.forEach(function(f){
          if (f.type === 'buttons'){
            var active = document.querySelector('[data-field="' + f.id + '"].active');
            vals.push(active ? active.dataset.value : f.default);
          }
        });
        suffix = '|' + encodeURIComponent(vals[0] || '');
      }
      pv.innerHTML = '🔗 <span class="domain">' + escHtml(getBaseUrl()) + '</span><span class="hash">#' + escHtml(gid) + '+' + escHtml(user) + escHtml(suffix) + '</span>';
      pv.style.opacity = '1';
    }
    gi.addEventListener('input', updatePreview);
    un.addEventListener('input', updatePreview);
    setTimeout(function(){ gi.focus(); }, 100);
  }
  
  function renderSuccess(){
    setScreen(
      '<div class="screen active"><div class="card">' +
        '<div class="tick">✓</div>' +
        '<h2>GAME PUBLISHED!</h2>' +
        '<p class="sub">Share this URL — anyone who opens it plays your game directly</p>' +
        '<div class="url-display">' +
          '🔗 <span class="domain">' + escHtml(getBaseUrl()) + '</span><span class="hash">#' + escHtml(finalGameID) + '+' + escHtml(finalUsername) + '</span>' +
        '</div>' +
        '<div class="meta">Game: <b style="color:#c7d2fe">' + escHtml(finalGameName) + '</b> · Creator: <b style="color:#c084fc">#' + escHtml(finalUsername) + '</b></div>' +
        '<button class="cta" style="margin-top:24px" onclick="window.__lyraOpenGame()">🎮 OPEN GAME</button>' +
        '<div class="rows">' +
          '<button class="ghost" onclick="window.__lyraCopyLink()">🔗 COPY LINK</button>' +
          '<button class="ghost" onclick="window.__lyraNewGame()">+ NEW GAME</button>' +
        '</div>' +
      '</div></div>'
    );
  }
  
  window.__lyraGoLanding = function(){ renderLanding(); };
  window.__lyraGoChoose = function(){ renderChoose(); };
  window.__lyraSelectGame = function(type){ chosenGame = type; renderDetails(type); };
  window.__lyraNewGame = function(){ chosenGame = null; finalShareUrl = ''; renderChoose(); };
  
  window.__lyraPublish = function(){
    var gi = document.getElementById('inGameName');
    var un = document.getElementById('inUsername');
    var rawName = (gi.value || '').trim();
    var rawUser = (un.value || '').trim().replace(/^#+/, '').replace(/\s+/g, '');
    if (!rawName){ alert('Please enter a game name.'); gi.focus(); return; }
    if (!rawUser){ alert('Please enter a username.'); un.focus(); return; }
    var nameSlug = slugify(rawName);
    if (!nameSlug){ alert('Game name must contain at least one letter or number.'); gi.focus(); return; }
    if (!/^[a-zA-Z0-9_-]+$/.test(rawUser)){ alert('Username can only contain letters, numbers, hyphens and underscores.'); un.focus(); return; }
    finalGameID = chosenGame + '-' + nameSlug;
    finalUsername = rawUser;
    finalGameName = prettierName(rawName);
    var suffix = '';
    var cfg = GAME_CONFIGS[chosenGame];
    if (cfg){
      var vals = [];
      cfg.fields.forEach(function(f){
        if (f.type === 'buttons'){
          var active = document.querySelector('[data-field="' + f.id + '"].active');
          vals.push(active ? active.dataset.value : f.default);
        }
      });
      suffix = '|' + encodeURIComponent(vals[0] || '');
    }
    finalShareUrl = getBaseUrl() + '#' + finalGameID + '+' + finalUsername + suffix;
    renderSuccess();
  };
  
  window.__lyraOpenGame = function(){ if (!finalShareUrl){ alert('Please publish first.'); return; } window.open(finalShareUrl, '_blank'); };
  window.__lyraCopyLink = function(){ if (!finalShareUrl){ alert('Please publish first.'); return; } copyText(finalShareUrl, '🔗 Link copied!'); };
  
  function copyText(text, msg){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ alert(msg); }).catch(function(){ fallbackCopy(text, msg); });
    } else fallbackCopy(text, msg);
  }
  function fallbackCopy(text, msg){
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); alert(msg); } catch(e){ alert('Copy failed.'); }
    document.body.removeChild(ta);
  }
  
  function boot(){
    var route = parseRoute();
    if (route){ openGameInIframe(route); return; }
    renderLanding();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

</body>
</html>
