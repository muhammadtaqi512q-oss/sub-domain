<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYRA GAME BUILDER — Created by MUHAMMAD TAQI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',sans-serif;background:radial-gradient(circle at 15% 10%,#1e1b4b 0%,#0b1020 45%,#04060d 100%);background-attachment:fixed;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden}
body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none}
body::before{width:55vw;height:55vw;top:-20%;left:-15%;background:radial-gradient(circle,rgba(99,102,241,.55) 0%,transparent 70%);animation:floatA 22s ease-in-out infinite}
body::after{width:55vw;height:55vw;bottom:-20%;right:-15%;background:radial-gradient(circle,rgba(168,85,247,.45) 0%,transparent 70%);animation:floatB 26s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(8%,12%)}}
@keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(-10%,-8%)}}
#lyraRoot{position:relative;z-index:1;width:100%;max-width:780px}
.screen{display:none}
.screen.active{display:block;animation:slideIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.card{background:rgba(11,18,35,.72);border:1px solid rgba(139,143,255,.18);border-radius:28px;padding:40px 34px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 40px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.02) inset;text-align:center;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#6366f1,#a855f7,transparent);opacity:.8}
.badge{display:inline-block;font-size:10px;letter-spacing:.28em;padding:8px 16px;border-radius:100px;background:linear-gradient(90deg,rgba(99,102,241,.25),rgba(168,85,247,.25));border:1px solid rgba(139,143,255,.3);font-weight:800;color:#c7d2fe}
h1{font-family:'Cinzel',serif;font-size:3rem;font-weight:900;line-height:1.02;letter-spacing:-.02em;margin:22px 0 10px}
h1 span{background:linear-gradient(135deg,#818cf8 0%,#c084fc 50%,#f472b6 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.byline{color:#94a3b8;font-size:.92rem;margin-bottom:32px}
.byline b{color:#fff;letter-spacing:.06em}
h2{font-family:'Cinzel',serif;font-size:1.7rem;font-weight:800;letter-spacing:.01em;margin:14px 0 8px}
.sub{color:#94a3b8;font-size:.9rem;line-height:1.65;margin-bottom:26px}
.step{display:inline-block;font-size:9px;letter-spacing:.28em;font-weight:800;color:#a5b4fc;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.3);padding:5px 12px;border-radius:100px;margin-bottom:6px}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:14px;letter-spacing:.08em;padding:18px 28px;border-radius:16px;color:#fff;background:linear-gradient(135deg,#6366f1 0%,#a855f7 100%);box-shadow:0 15px 35px rgba(99,102,241,.4),inset 0 1px 0 rgba(255,255,255,.15);transition:transform .18s,box-shadow .18s;margin-top:8px}
.cta:hover{transform:translateY(-2px);box-shadow:0 20px 45px rgba(99,102,241,.55),inset 0 1px 0 rgba(255,255,255,.2)}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:1;font-family:inherit;font-weight:700;font-size:12px;letter-spacing:.06em;padding:14px 20px;border-radius:13px;color:#e2e8f0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:.18s}
.ghost:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:16px;background:transparent;border:none;color:#94a3b8;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;padding:8px 12px;border-radius:8px;transition:.18s}
.back:hover{color:#fff;background:rgba(255,255,255,.05)}
.version{font-size:10px;color:#475569;letter-spacing:.2em;margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,.06)}
.game-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}
@media (max-width:700px){.game-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.game-grid{grid-template-columns:repeat(2,1fr)}}
.game-card{padding:14px 8px;background:linear-gradient(160deg,rgba(30,41,59,.7),rgba(15,23,42,.5));border:1.5px solid rgba(139,143,255,.18);border-radius:15px;cursor:pointer;transition:.24s cubic-bezier(.2,.8,.2,1);text-align:center;position:relative;overflow:hidden}
.game-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(99,102,241,.25),transparent 60%);opacity:0;transition:.3s}
.game-card:hover{border-color:rgba(139,143,255,.6);transform:translateY(-5px) scale(1.02);box-shadow:0 25px 50px rgba(99,102,241,.3)}
.game-card:hover::before{opacity:1}
.game-icon{font-size:30px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));position:relative;z-index:1}
.game-card h3{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.08em;color:#fff;margin-bottom:3px;position:relative;z-index:1;line-height:1.15}
.game-card p{font-size:8.5px;color:#94a3b8;line-height:1.3;position:relative;z-index:1}
.chosen-game{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:100px;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.35);margin-bottom:22px;font-weight:800;letter-spacing:.15em;font-size:12px;color:#c7d2fe}
.chosen-game .icon{font-size:20px}
label{display:block;text-align:left;font-size:10px;letter-spacing:.22em;font-weight:800;color:#94a3b8;margin:18px 0 8px}
.inp{width:100%;background:#050914;border:1.5px solid #1e293b;border-radius:12px;padding:15px 16px;color:#fff;font-size:14px;font-family:inherit;outline:none;transition:.2s}
.inp:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.18)}
.hash-wrap{display:flex;align-items:center;background:#050914;border:1.5px solid #1e293b;border-radius:12px;overflow:hidden;transition:.2s}
.hash-wrap:focus-within{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.18)}
.hash-wrap span{padding-left:16px;color:#a855f7;font-weight:900;font-size:14px}
.hash-wrap .inp{border:none;background:transparent;box-shadow:none!important}
.grid-options{display:flex;gap:8px}
.grid-btn{flex:1;padding:13px 8px;border-radius:11px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);color:#e2e8f0;cursor:pointer;font-family:inherit;font-weight:800;font-size:13px;letter-spacing:.04em;transition:.18s}
.grid-btn:hover{background:rgba(255,255,255,.12)}
.grid-btn.active{background:linear-gradient(135deg,#6366f1,#a855f7);border-color:#a855f7;color:#fff;box-shadow:0 8px 20px rgba(99,102,241,.4)}
.preview{margin-top:20px;padding:12px 16px;background:#020617;border:1px solid rgba(16,185,129,.35);border-radius:10px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#10b981;word-break:break-all;text-align:left;line-height:1.6;min-height:38px;opacity:.75}
.preview .hash{color:#c084fc;font-weight:800}
.preview .domain{color:#f8fafc}
.tick{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#fff;margin:0 auto 16px;box-shadow:0 15px 35px rgba(16,185,129,.5),inset 0 2px 0 rgba(255,255,255,.2);animation:popIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes popIn{0%{transform:scale(0)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
.url-display{margin:18px 0 24px;padding:16px;background:#020617;border:1px solid rgba(16,185,129,.4);border-radius:12px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#10b981;word-break:break-all;line-height:1.7;text-align:left}
.url-display .hash{color:#c084fc;font-weight:800}
.url-display .domain{color:#f8fafc}
.rows{display:flex;gap:10px;margin-top:12px}
.rows .ghost{flex:1}
.meta{font-size:11px;color:#64748b;line-height:1.7;margin-top:6px}
@media (max-width:520px){h1{font-size:2.2rem}.card{padding:30px 22px;border-radius:22px}.game-icon{font-size:26px}}
</style>
</head>
<body>

<div id="lyraRoot"></div>

<script type="text/template" id="tpl-tetris">
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>%%GAME_NAME%% — LYRA</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Plus Jakarta Sans',sans-serif;background:radial-gradient(circle at center,#1b2838 0%,#0d121d 100%);color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;padding:10px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}header{width:100%;max-width:700px;margin:0 auto 8px;padding:10px 16px;background:rgba(22,32,50,.75);backdrop-filter:blur(16px);border:1px solid rgba(255,215,0,.15);border-radius:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 20px 50px rgba(0,0,0,.5);flex-wrap:wrap;gap:8px}.brand{display:flex;align-items:center;gap:9px}.brand-icon{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#a855f7);display:flex;align-items:center;justify-content:center;font-size:17px}.brand h1{font-family:'Cinzel',serif;font-size:.95rem;font-weight:800;letter-spacing:.06em;color:#fbbf24}.brand p{font-size:9px;color:#94a3b8;letter-spacing:.15em;text-transform:uppercase}.stats{display:flex;gap:10px}.stat{text-align:center}.stat-label{font-size:8px;color:#94a3b8;letter-spacing:.15em;text-transform:uppercase;display:block;margin-bottom:1px}.stat-value{font-family:'Cinzel',serif;font-size:1rem;font-weight:800;color:#fbbf24;font-variant-numeric:tabular-nums}main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;gap:8px;min-height:0}canvas{background:#0f172a;border-radius:12px;border:3px solid rgba(251,191,36,.4);box-shadow:0 20px 50px rgba(0,0,0,.6);max-width:100%;max-height:100%;display:block}.ctrl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(90vw,240px)}.ctrl{font-family:inherit;font-weight:800;font-size:16px;padding:10px 0;border-radius:10px;border:1px solid rgba(255,215,0,.25);background:rgba(251,191,36,.1);color:#fbbf24;cursor:pointer;user-select:none}.ctrl:active{transform:scale(.94);background:rgba(251,191,36,.25)}.controls{width:100%;max-width:700px;margin:8px auto 0;padding:8px 12px;background:rgba(22,32,50,.75);border:1px solid rgba(255,215,0,.15);border-radius:12px;display:flex;gap:8px;justify-content:center}button.primary{font-family:inherit;font-weight:700;font-size:12px;padding:9px 18px;border-radius:10px;border:1px solid #fbbf24;background:linear-gradient(135deg,#f59e0b,#d97706);color:#0f172a;cursor:pointer;box-shadow:0 8px 20px rgba(245,158,11,.3)}.footer{width:100%;max-width:700px;margin:8px auto 0;text-align:center;font-size:9px;color:#475569;letter-spacing:.15em;text-transform:uppercase}.win-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.win-overlay.show{display:flex}.win-card{background:rgba(15,23,42,.95);border:2px solid rgba(251,191,36,.5);border-radius:22px;padding:34px 26px;max-width:400px;width:100%;text-align:center;animation:popIn .5s}@keyframes popIn{0%{transform:scale(.7);opacity:0}80%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}.win-icon{width:70px;height:70px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(135deg,#ef4444,#991b1b);display:flex;align-items:center;justify-content:center;font-size:34px}.win-card h2{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:900;color:#fbbf24;margin-bottom:6px}.win-card p{font-size:12px;color:#94a3b8;margin-bottom:20px}.win-stats{display:flex;justify-content:center;gap:20px;margin-bottom:20px;padding:12px;background:rgba(255,255,255,.03);border-radius:12px}.win-stat-value{font-family:'Cinzel',serif;font-size:1.4rem;font-weight:900;color:#fbbf24;display:block}.win-stat-label{font-size:9px;color:#94a3b8;letter-spacing:.15em;text-transform:uppercase}@media(max-width:500px){.brand h1{font-size:.85rem}.stat-value{font-size:.9rem}}</style></head>
<body>
<header><div class="brand"><div class="brand-icon">📦</div><div><h1>%%GAME_NAME%%</h1><p>#%%GAME_ID%% · @%%USERNAME%%</p></div></div><div class="stats"><div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="scoreEl">0</span></div><div class="stat"><span class="stat-label">Lines</span><span class="stat-value" id="linesEl">0</span></div><div class="stat"><span class="stat-label">Lvl</span><span class="stat-value" id="levelEl">1</span></div></div></header>
<main><canvas id="cv" width="200" height="400"></canvas><div class="ctrl-grid"><button class="ctrl" data-k="left">◀</button><button class="ctrl" data-k="rotate">⟳</button><button class="ctrl" data-k="right">▶</button><button class="ctrl" data-k="soft">▼</button><button class="ctrl" data-k="drop">⤓</button><button class="ctrl" data-k="pause">⏸</button></div></main>
<div class="controls"><button class="primary" id="newBtn">🔄 New Game</button></div>
<div class="footer">LYRA GAME BUILDER · Created by MUHAMMAD TAQI</div>
<div class="win-overlay" id="winOverlay"><div class="win-card"><div class="win-icon">💀</div><h2>GAME OVER</h2><p>Try again!</p><div class="win-stats"><div><span class="win-stat-value" id="winScore">0</span><span class="win-stat-label">Score</span></div><div><span class="win-stat-value" id="winLines">0</span><span class="win-stat-label">Lines</span></div></div><button class="primary" id="playAgainBtn">Play Again</button></div></div>
<script>(function(){var CFG="%%CONFIG_VALUE%%";var SPEEDS={slow:800,normal:550,fast:350};var BASE=SPEEDS[CFG]||550;var COLS=10,ROWS=20,B=20;var cv=document.getElementById('cv'),ctx=cv.getContext('2d');var board,piece,px,py,dropTime,lastTime,score,lines,level,paused,over,rafId;var SHAPES=[[[1,1,1,1]],[[2,2],[2,2]],[[0,3,0],[3,3,3]],[[4,0,0],[4,4,4]],[[0,0,5],[5,5,5]],[[0,6,6],[6,6,0]],[[7,7,0],[0,7,7]]];var COLORS=['','#22d3ee','#fbbf24','#a855f7','#f59e0b','#3b82f6','#10b981','#ef4444'];
function init(){board=[];for(var i=0;i<ROWS;i++)board.push(new Array(COLS).fill(0));score=0;lines=0;level=1;paused=false;over=false;dropTime=0;lastTime=performance.now();document.getElementById('winOverlay').classList.remove('show');document.getElementById('scoreEl').textContent='0';document.getElementById('linesEl').textContent='0';document.getElementById('levelEl').textContent='1';spawn();if(rafId)cancelAnimationFrame(rafId);loop()}
function spawn(){var t=SHAPES[Math.floor(Math.random()*SHAPES.length)];piece=t.map(r=>r.slice());px=Math.floor((COLS-piece[0].length)/2);py=0;if(collide(px,py,piece)){over=true;showOver()}}
function collide(x,y,p){for(var r=0;r<p.length;r++)for(var c=0;c<p[r].length;c++){if(!p[r][c])continue;var nx=x+c,ny=y+r;if(nx<0||nx>=COLS||ny>=ROWS)return true;if(ny>=0&&board[ny][nx])return true}return false}
function rot(m){var N=m.length,M=m[0].length,r=[];for(var y=0;y<M;y++){r.push([]);for(var x=0;x<N;x++)r[y].push(m[N-1-x][y])}return r}
function merge(){for(var r=0;r<piece.length;r++)for(var c=0;c<piece[r].length;c++)if(piece[r][c]&&py+r>=0)board[py+r][px+c]=piece[r][c]}
function clearLines(){var cnt=0;for(var y=ROWS-1;y>=0;y--){if(board[y].every(v=>v)){board.splice(y,1);board.unshift(new Array(COLS).fill(0));cnt++;y++}}if(cnt){lines+=cnt;score+=[0,100,300,500,800][cnt]*level;if(lines>=level*10)level++;document.getElementById('scoreEl').textContent=score;document.getElementById('linesEl').textContent=lines;document.getElementById('levelEl').textContent=level}}
function draw(){ctx.fillStyle='#0f172a';ctx.fillRect(0,0,cv.width,cv.height);for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++)if(board[y][x]){ctx.fillStyle=COLORS[board[y][x]];ctx.fillRect(x*B,y*B,B-1,B-1)}if(piece&&!over)for(var r=0;r<piece.length;r++)for(var c=0;c<piece[r].length;c++)if(piece[r][c]){ctx.fillStyle=COLORS[piece[r][c]];ctx.fillRect((px+c)*B,(py+r)*B,B-1,B-1)}ctx.strokeStyle='rgba(255,255,255,.04)';for(var i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*B,0);ctx.lineTo(i*B,cv.height);ctx.stroke()}for(var i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*B);ctx.lineTo(cv.width,i*B);ctx.stroke()}}
function drop(){if(!collide(px,py+1,piece))py++;else{merge();clearLines();spawn()}}
function move(dx){if(!collide(px+dx,py,piece))px+=dx}
function rotatePiece(){var r=rot(piece);if(!collide(px,py,r))piece=r}
function hardDrop(){while(!collide(px,py+1,piece))py++;drop()}
function loop(t){rafId=requestAnimationFrame(loop);if(over||paused)return;var dt=t-lastTime;lastTime=t;var speed=BASE/Math.max(.5,level*.7);dropTime+=dt;if(dropTime>speed){drop();dropTime=0}draw()}
function showOver(){document.getElementById('winScore').textContent=score;document.getElementById('winLines').textContent=lines;document.getElementById('winOverlay').classList.add('show')}
document.querySelectorAll('[data-k]').forEach(b=>{b.addEventListener('click',()=>{if(over)return;var k=b.dataset.k;if(k==='left')move(-1);else if(k==='right')move(1);else if(k==='rotate')rotatePiece();else if(k==='soft'){drop();dropTime=0}else if(k==='drop')hardDrop();else if(k==='pause'){paused=!paused;lastTime=performance.now()}draw()})});
document.addEventListener('keydown',e=>{if(over)return;if(e.key==='ArrowLeft'){move(-1);draw();e.preventDefault()}else if(e.key==='ArrowRight'){move(1);draw();e.preventDefault()}else if(e.key==='ArrowDown'){drop();dropTime=0;draw();e.preventDefault()}else if(e.key==='ArrowUp'){rotatePiece();draw();e.preventDefault()}else if(e.key===' '){hardDrop();draw();e.preventDefault()}else if(e.key==='p'||e.key==='P'){paused=!paused;lastTime=performance.now()}});
document.getElementById('newBtn').addEventListener('click',init);document.getElementById('playAgainBtn').addEventListener('click',init);init()})();<\/script></body></html>
</script>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>%%GAME_NAME%% — LYRA</title>

129,.3);color:#10b981;font-size:20px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none}.dbtn:active{background:rgba(16,185,129,.25);transform:scale(.95)}.controls{width:100%;max-width:700px;margin:8px auto 0;padding:8px 12px;background:rgba(22,32,50,.75);border:1px solid rgba(255,215,0,.15);border-radius:12px;display:flex;gap:8px;justify-content:center}button.primary{font-family:inherit;font-weight:700;font-size:12px;padding:9px 18px;border-radius:10px;border:1px solid #fbbf24;background:linear-gradient(135deg,#f59e0b,#d97706);color:#0f172a;cursor:pointer;box-shadow:0 8px 20px rgba(245,158,11,.3)}.footer{width:100%;max-width:700px;margin:8px auto 0;text-align:center;font-size:9px;color:#475569;letter-spacing:.15em;text-transform:uppercase}.win-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.win-overlay.show{display:flex}.win-card{background:rgba(15,23,42,.95);border:2px solid rgba(251,191,36,.5);border-radius:22px;padding:34px 26px;max-width:400px;width:100%;text-align:center;animation:popIn .5s}@keyframes popIn{0%{transform:scale(.7);opacity:0}80%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}.win-icon{width:70px;height:70px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(135deg,#ef4444,#991b1b);display:flex;align-items:center;justify-content:center;font-size:34px}.win-card h2{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:900;color:#fbbf24;margin-bottom:6px}.win-card p{font-size:12px;color:#94a3b8;margin-bottom:20px}.win-stats{display:flex;justify-content:center;gap:20px;margin-bottom:20px;padding:12px;background:rgba(255,255,255,.03);border-radius:12px}.win-stat-value{font-family:'Cinzel',serif;font-size:1.4rem;font-weight:900;color:#fbbf24;display:block}.win-stat-label{font-size:9px;color:#94a3b8;letter-spacing:.15em;text-transform:uppercase}@media(max-width:5 <div class="controls"><button class="primary" id="newBtn">🔄 New Game</button></div>
<div class="footer">LYRA GAME BUILDER · Created by MUHAMMAD TAQI</div>
<div class="win-overlay" id="winOverlay"><div class="win-card"><div class="win-icon">💀</div><h2>GAME OVER</h2><p>You crashed!</p><div class="win-stats"><div><span class="win-stat-value" id="winScore">0</span><span class="win-stat-label">Score</span></div></div><button class="primary" id="playAgainBtn">Play Again</button></div></div>
<script>(function(){var CFG="%%CONFIG_VALUE%%";var SPEEDS={easy:160,normal:110,hard:70};var STEP=SPEEDS[CFG]||110;var cv=document.getElementById('cv'),ctx=cv.getContext('2d');var N=20,S=20;var snake,dir,nextDir,food,score,best,over,timer;best=parseInt(localStorage.getItem('lyraSnakeBest')||'0',10);
function init(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;over=false;placeFood();document.getElementById('winOverlay').classList.remove('show');document.getElementById('scoreEl').textContent='0';document.getElementById('bestEl').textContent=best;if(timer)clearInterval(timer);timer=setInterval(tick,STEP);draw()}
function placeFood(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function tick(){if(over)return;dir=nextDir;var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)){over=true;if(timer)clearInterval(timer);if(score>best){best=score;localStorage.setItem('lyraSnakeBest',best)}document.getElementById('winScore').textContent=score;document.getElementById('winOverlay').classList.add('show');return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;document.getElementById('scoreEl').textContent=score;if(score>best){best=score;localStorage.setItem('lyraSnakeBest',best);document.getElementById('bestEl').textContent=best}placeFood()}else snake.pop();draw()}
function draw(){ctx.fillStyle='#0f172a';ctx.fillRect(0,0,cv.width,cv.height);ctx.strokeStyle='rgba(255,255,255,.04)';for(var i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,cv.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*S);ctx.lineTo(cv.width,i*S);ctx.stroke()}ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S/2-3,0,Math.PI*2);ctx.fill();snake.forEach(function(s,i){ctx.fillStyle=i===0?'#fbbf24':'#10b981';ctx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2)})}
function setDir(d){var v={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[d];if(!v)return;if(v.x===-dir.x&&v.y===-dir.y)return;nextDir=v}
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>setDir(b.dataset.dir)));
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w'){setDir('up');e.preventDefault()}else if(e.key==='ArrowDown'||e.key==='s'){setDir('down');e.preventDefault()}else if(e.key==='ArrowLeft'||e.key==='a'){setDir('left');e.preventDefault()}else if(e.key==='ArrowRight'||e.key==='d'){setDir('right');e.preventDefault()}});
var ts=null;cv.addEventListener('touchstart',e=>{ts={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});cv.addEventListener('touchend',e=>{if(!ts)return;var dx=e.changedTouches[0].clientX-ts.x,dy=e.changedTouches[0].clientY-ts.y;if(Math.abs(dx)<20&&Math.abs(dy)<20){ts=null;return}if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?'right':'left');else setDir(dy>0?'down':'up');ts=null},{passive:true});
document.getElementById('newBtn').addEventListener('click',init);document.getElementById('playAgainBtn').addEventListener('click',init);init()})();<\/script></body></html>
</script>

-family:inherit;font-weight:700;font-size:12px;padding:9px 18px;border-radius:10px;border:1px solid #fbbf24;background:linear-gradient(135deg,#f59e0b,#d97706);color:#0f172a;cursor:pointer;box-shadow:0 8px 20px rgba(245,158,11,.3)}.footer{width:100%;max-width:700px;margin:8px auto 0;text-align:center;font-size:9px;color:#475569;letter-spacing:.15em;text-transform:uppercase}.win-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.win-overlay.show{display:flex}.win-card{background:rgba(15,23,42,.95);border:2px solid rgba(251,191,36,.5);border-radius:22px;padding:34px 26px;max-width:400px;width:100%;text-align:center;animation:popIn .5s}@keyframes popIn{0%{transform:scale(.7);opacity:0}80%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}.win-icon{width:70px;height:70px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:34px}.win-card h2{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:900;color:#fbbf24;margin-bottom:6px}.win-card p{font-size:12px;color:#94a3b8;margin-bottom:20px}.win-stats{display:flex;justify-content:center;gap:20px;margin-bottom:20px;padding:12px;background:rgba(255,255,255,.03);border-radius:12px}.win-stat-value{font-family:'Cinzel',serif;font-size:1.4rem;font-weight:900;color:#fbbf24;display:block}.win-stat-label{font-size:9px;color:#94a3b8;letter-spacing:.15em;text-transform:uppercase}@media(max-width:500px){.brand h1{font-size:.85rem}}</style></head>
<body>
<header><div class="brand"><div class="brand-icon">🧱</div><div><h1>%%GAME_NAME%%</h1><p>#%%GAME_ID%% · @%%USERNAME%%</p></div></div><div class="stats"><div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="scoreEl">0</span></div><div class="stat"><span class="stat-label">Lives</span><span class="stat-value" id="livesEl">3</span></div></div></header>
<main><canvas id="cv" width="400" height="500"></canvas></main>
<div class="controls"><button class="primary" id="newBtn">🔄 New Game</button></div>
<div class="footer">LYRA GAME BUILDER · Created by MUHAMMAD TAQI</div>
<div class="win-overlay" id="winOverlay"><div class="win-card"><div class="win-icon" id="winIcon">🏆</div><h2 id="winTitle">GAME OVER</h2><p id="winMsg">Try again!</p><div class="win-stats"><div><span class="win-stat-value" id="winScore">0</span><span class="win-stat-label">Score</span></div></div><button class="primary" id="playAgainBtn">Play Again</button></div></div>
<script>(function(){var CFG="%%CONFIG_VALUE%%";var DIFFS={easy:{ball:3,pw:100,rows:4},normal:{ball:4,pw:90,rows:5},hard:{ball:5.5,pw:80,rows:6}};var D=DIFFS[CFG]||DIFFS.normal;var cv=document.getElementById('cv'),ctx=cv.getContext('2d');var W=cv.width,H=cv.height;var paddle,ball,bricks,score,lives,over,running;
function init(){paddle={w:D.pw,h:12,x:(W-D.pw)/2,y:H-30};ball={x:W/2,y:H-60,r:7,dx:D.ball*(Math.random()<.5?1:-1),dy:-D.ball};bricks=[];score=0;lives=3;over=false;running=true;var cols=8,rows=D.rows,bw=(W-20)/cols,bh=18;var palette=['#f43f5e','#f97316','#fbbf24','#10b981','#3b82f6','#a855f7'];for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)bricks.push({x:10+c*bw,y:50+r*bh,w:bw-3,h:bh-3,color:palette[r%palette.length],alive:true});document.getElementById('scoreEl').textContent='0';document.getElementById('livesEl').textContent='3';document.getElementById('winOverlay').classList.remove('show')}
function draw(){ctx.fillStyle='#0f172a';ctx.fillRect(0,0,W,H);bricks.forEach(b=>{if(b.alive){ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h)}});ctx.fillStyle='#fbbf24';ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);ctx.fillStyle='#f43f5e';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill()}
function step(){if(!running||over)return;ball.x+=ball.dx;ball.y+=ball.dy;if(ball.x-ball.r<0||ball.x+ball.r>W){ball.dx=-ball.dx;ball.x=Math.max(ball.r,Math.min(W-ball.r,ball.x))}if(ball.y-ball.r<0){ball.dy=-ball.dy;ball.y=ball.r}if(ball.y+ball.r>=paddle.y&&ball.y+ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x-ball.r&&ball.x<=paddle.x+paddle.w+ball.r&&ball.dy>0){ball.dy=-Math.abs(ball.dy);var hit=(ball.x-paddle.x)/paddle.w-0.5;ball.dx=hit*D.ball*2;if(Math.abs(ball.dx)<1.5)ball.dx=ball.dx<0?-1.5:1.5}for(var i=0;i<bricks.length;i++){var b=bricks[i];if(!b.alive)continue;if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.alive=false;score+=10;document.getElementById('scoreEl').textContent=score;var ox=Math.min(ball.x+ball.r-b.x,b.x+b.w-(ball.x-ball.r));var oy=Math.min(ball.y+ball.r-b.y,b.y+b.h-(ball.y-ball.r));if(ox<oy)ball.dx=-ball.dx;else ball.dy=-ball.dy;break}}if(ball.y-ball.r>H){lives--;document.getElementById('livesEl').textContent=lives;if(lives<=0){over=true;running=false;endGame('GAME OVER','No lives left')}else{ball.x=W/2;ball.y=H-60;ball.dx=D.ball*(Math.random()<.5?1:-1);ball.dy=-D.ball;paddle.x=(W-paddle.w)/2}}if(bricks.every(b=>!b.alive)){over=true;running=false;endGame('YOU WIN!','All bricks cleared!')}draw()}
function endGame(title,msg){document.getElementById('winTitle').textContent=title;document.getElementById('winMsg').textContent=msg;document.getElementById('winScore').textContent=score;document.getElementById('winIcon').textContent=title==='YOU WIN!'?'🏆':'💀';document.getElementById('winOverlay').classList.add('show')}
function pos(e){var r=cv.getBoundingClientRect();var x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;paddle.x=Math.max(0,Math.min(W-paddle.w,x*(W/r.width)-paddle.w/2))}
cv.addEventListener('mousemove',pos);cv.addEventListener('touchmove',e=>{e.preventDefault();pos(e)},{passive:false});cv.addEventListener('touchstart',pos,{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){paddle.x=Math.max(0,paddle.x-25);e.preventDefault()}else if(e.key==='ArrowRight'){paddle.x=Math.min(W-paddle.w,paddle.x+25);e.preventDefault()}});
document.getElementById('newBtn').addEventListener('click',()=>{init();draw()});document.getElementById('playAgainBtn').addEventListener('click',()=>{init();draw()});
init();draw();setInterval(step,16)})();<\/script></body></html>
</script>

<script>(function(){var CFG="%%CONFIG_VALUE%%";var DIFFS={easy:{gap:140,speed:2,grav:.35,jump:-5.5},normal:{gap:120,speed:2.6,grav:.45,jump:-6.3},hard:{gap:100,speed:3.3,grav:.55,jump:-7}};var D=DIFFS[CFG]||DIFFS.normal;var cv=document.getElementById('cv'),ctx=cv.getContext('2d');var W=cv.width,H=cv.height;var bird,pipes,score,best,over,started;best=parseInt(localStorage.getItem('lyraFlappyBest')||'0',10);
function init(){bird={x:80,y:H/2,r:12,vy:0};pipes=[];score=0;over=false;started=false;document.getElementById('winOverlay').classList.remove('show');document.getElementById('scoreEl').textContent='0';document.getElementById('bestEl').textContent=best;spawnPipe();draw()}
function spawnPipe(){var gap=D.gap;var topMin=50,topMax=H-gap-100;var top=topMin+Math.random()*(topMax-topMin);pipes.push({x:W,top:top,gap:gap,scored:false})}
function flap(){if(over)return;if(!started){started=true;run()}bird.vy=D.jump}
function run(){if(over)return;requestAnimationFrame(loop)}
function loop(){if(over)return;bird.vy+=D.grav;bird.y+=bird.vy;if(bird.y-bird.r<0){bird.y=bird.r;bird.vy=0}if(bird.y+bird.r>H){die();return}for(var i=0;i<pipes.length;i++){var p=pipes[i];p.x-=D.speed;if(!p.scored&&p.x<bird.x){p.scored=true;score++;document.getElementById('scoreEl').textContent=score}if(p.x<0)continue;if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+50){if(bird.y-bird.r<p.top||bird.y+bird.r>p.top+p.gap){die();return}}}pipes=pipes.filter(p=>p.x>-60);if(pipes.length<3&&pipes[pipes.length-1].x<W-200)spawnPipe();draw();requestAnimationFrame(loop)}
function draw(){ctx.fillStyle='#4ade80';ctx.fillRect(0,0,W,H);ctx.fillStyle='#22c55e';ctx.fillRect(0,H-40,W,40);pipes.forEach(p=>{ctx.fillStyle='#16a34a';ctx.fillRect(p.x,0,50,p.top);ctx.fillRect(p.x,p.top+p.gap,50,H-p.top-p.gap);ctx.strokeStyle='#15803d';ctx.lineWidth=3;ctx.strokeRect(p.x,0,50,p.top);ctx.strokeRect(p.x,p.top+p.gap,50,H-p.top-p.gap)});ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(bird.x,bird.y,bird.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f59e0b';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#0f172a';ctx.beginPath();ctx.arc(bird.x+4,bird.y-2,2,0,Math.PI*2);ctx.fill()}
function die(){over=true;if(score>best){best=score;localStorage.setItem('lyraFlappyBest',best);document.getElementById('bestEl').textContent=best}document.getElementById('winScore').textContent=score;document.getElementById('winOverlay').classList.add('show')}

<script>(function(){var CFG="%%CONFIG_VALUE%%";var AI=CFG||'medium';var board,humanTurn,over,wins=0,losses=0,draws=0;
function init(){board=['','','','','','','','',''];humanTurn=true;over=false;document.getElementById('status').textContent='Your turn (X)';render()}
function render(){var b=document.getElementById('board');b.innerHTML='';board.forEach((v,i)=>{var c=document.createElement('div');c.className='cell';if(v){c.classList.add('filled',v==='X'?'x':'o');c.textContent=v}c.addEventListener('click',()=>play(i));b.appendChild(c)})}
function play(i){if(over||!humanTurn||board[i])return;board[i]='X';if(checkEnd())return;humanTurn=false;document.getElementById('status').textContent='AI thinking...';setTimeout(aiMove,350)}
function aiMove(){if(over)return;var idx=chooseMove();board[idx]='O';if(checkEnd())return;humanTurn=true;document.getElementById('status').textContent='Your turn (X)';render()}
function chooseMove(){var empties=board.map((v,i)=>v?null:i).filter(v=>v!==null);if(AI==='easy'){if(Math.random()<.5)return empties[Math.floor(Math.random()*empties.length)];return bestMove()}
if(AI==='medium'){if(Math.random()<.25)return empties[Math.floor(Math.random()*empties.length)];return bestMove()}
return bestMove()}
function bestMove(){var best=-Infinity,bestIdx=-1;for(var i=0;i<9;i++){if(board[i])continue;board[i]='O';var s=minimax(false,0);board[i]='';if(s>best){best=s;bestIdx=i}}return bestIdx}
function minimax(isMax,depth){var w=winner();if(w==='O')return 10-depth;if(w==='X')return depth-10;if(board.every(v=>v))return 0;if(isMax){var b=-Infinity;for(var i=0;i<9;i++){if(board[i])continue;board[i]='O';b=Math.max(b,minimax(false,depth+1));board[i]=''}return b}else{var b=Infinity;for(var i=0;i<9;i++){if(board[i])continue;board[i]='X';b=Math.min(b,minimax(true,depth+1));board[i]=''}return b}}
function winner(){var L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(var i=0;i<L.length;i++){var a=L[i];if(board[a[0]]&&board[a[0]]===board[a[1]]&&board[a[1]]===board[a[2]])return{who:board[a[0]],line:a}}return null}
function checkEnd(){var w=winner();render();if(w){over=true;var cells=document.querySelectorAll('.cell');w.line.forEach(i=>cells[i].classList.add('win'));if(w.who==='X'){wins++;document.getElementById('winsEl').textContent=wins;document.getElementById('status').textContent='🎉 You win!'}else{losses++;document.getElementById('lossesEl').textContent=losses;document.getElementById('status').textContent='💀 AI wins!'}return true}if(board.every(v=>v)){over=true;draws++;document.getElementById('drawsEl').textContent=draws;document.getElementById('status').textContent="It's a draw!";return true}return false}
document.getElementById('newBtn').addEventListener('click',init);init()})();<\/script></body></html>

<script>(function(){var CFG="%%CONFIG_VALUE%%";var DUR=parseInt(CFG,10)||30;var score,timeLeft,active,gameTimer,spawnTimer;
function init(){score=0;timeLeft=DUR;active=false;document.getElementById('winOverlay').classList.remove('show');document.getElementById('scoreEl').textContent='0';document.getElementById('timeEl').textContent=DUR+'s';var g=document.getElementById('grid');g.innerHTML='';for(var i=0;i<9;i++){var h=document.createElement('div');h.className='hole';h.dataset.i=i;h.addEventListener('click',()=>hit(h));g.appendChild(h)}active=true;if(gameTimer)clearInterval(gameTimer);if(spawnTimer)clearTimeout(spawnTimer);gameTimer=setInterval(()=>{timeLeft--;document.getElementById('timeEl').textContent=timeLeft+'s';if(timeLeft<=0)endGame()},1000);spawnLoop()}

x;gap:8px;justify-content:center}button.primary{font-family:inherit;font-weight:700;font-size:12px;padding:9px 18px;border-radius:10px;border:1px solid #fbbf24;background:linear-gradient(135deg,#f59e0b,#d97706);color:#0f172a;cursor:pointer;box-shadow:0 8px 20px rgba(245,158,11,.3)}.footer{width:100%;max-width:700px;margin:8px auto 0;text-align:center;font-size:9px;color:#475569;letter-spacing:.15em;text-transform:uppercase}.win-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.win-overlay.show{display:flex}.win-card{background:rgba(15,23,42,.95);border:2px solid rgba(251,191,36,.5);border-radius:22px;padding:34px 26px;max-width:400px;width:100%;text-align:center;animation:popIn .5s}@keyframes popIn{0%{transform:scale(.7);opacity:0}80%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}.win-icon{width:70px;height:70px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(135deg,#ef4444,#991b1b);display:flex;align-items:center;justify-content:center;font-size:34px}.win-card h2{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:900;color:#fbbf24;margin-bottom:6px}.win-card p{font-size:12px;color:#94a3b8;margin-bottom:20px}.win-stats{display:flex;justify-content:center;gap:20px;margin-bottom:20px;padding:12px;background:rgba(255,255,255,.03);border-radius:12px}.win-stat-value{font-family:'Cinzel',serif;font-size:1.4rem;font-weight:900;color:#fbbf24;display:block}.win-stat-label{font-size:9px;color:#94a3b8;letter-spacing:.15em;text-transform:uppercase}@media(max-width:500px){.brand h1{font-size:.85rem}}</style></head>

<div class="win-overlay" id="winOverlay"><div class="win-card"><div class="win-icon">💀</div><h2>GAME OVER</h2><p>You were destroyed!</p><div class="win-stats"><div><span class="win-stat-value" id="winScore">0</span><span class="win-stat-label">Score</span></div></div><button class="primary" id="playAgainBtn">Play Again</button></div></div>
<script>(function(){var CFG="%%CONFIG_VALUE%%";var DIFFS={easy:{enemy:.8,fire:900},normal:{enemy:1.3,fire:700},hard:{enemy:2,fire:500}};var D=DIFFS[CFG]||DIFFS.normal;var cv=document.getElementById('cv'),ctx=cv.getContext('2d');var W=cv.width,H=cv.height;var ship,bullets,enemies,stars,score,lives,over,lastShot,spawn,rafId;
function init(){ship={x:W/2,y:H-40,w:26,h:26,dx:0};bullets=[];enemies=[];stars=[];for(var i=0;i<40;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.5});score=0;lives=3;over=false;lastShot=0;spawn=0;document.getElementById('scoreEl').textContent='0';document.getElementById('livesEl').textContent='3';document.getElementById('winOverlay').classList.remove('show');if(rafId)cancelAnimationFrame(rafId);draw()}
function draw(){ctx.fillStyle='#0f172a';ctx.fillRect(0,0,W,H);stars.forEach(s=>{ctx.fillStyle='rgba(255,255,255,'+(s.s/3)+')';ctx.fillRect(s.x,s.y,s.s,s.s)});bullets.forEach(b=>{ctx.fillStyle='#22d3ee';ctx.fillRect(b.x-1.5,b.y-8,3,10)});enemies.forEach(e=>{ctx.fillStyle=e.color;ctx.beginPath();ctx.moveTo(e.x,e.y-e.h/2);ctx.lineTo(e.x-e.w/2,e.y+e.h/2);ctx.lineTo(e.x+e.w/2,e.y+e.h/2);ctx.closePath();ctx.fill()});ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.moveTo(ship.x,ship.y-ship.h/2);ctx.lineTo(ship.x-ship.w/2,ship.y+ship.h/2);ctx.lineTo(ship.x+ship.w/2,ship.y+ship.h/2);ctx.closePath();ctx.fill();ctx.fillStyle='#f97316';ctx.beginPath();ctx.moveTo(ship.x-4,ship.y+ship.h/2);ctx.lineTo(ship.x+4,ship.y+ship.h/2);ctx.lineTo(ship.x,ship.y+ship.h/2+8);ctx.closePath();ctx.fill()}
function loop(){if(over)return;var now=performance.now();if(now-lastShot>D.fire){bullets.push({x:ship.x,y:ship.y-10});lastShot=now}bullets.forEach(b=>b.y-=8);bullets=bullets.filter(b=>b.y>-20);if(now-spawn>D.enemy*1000){spawn=now;enemies.push({x:30+Math.random()*(W-60),y:-20,w:24,h:24,color:'#ef4444',vy:1.5+Math.random()*1.5})}enemies.forEach(e=>e.y+=e.vy);enemies.forEach(e=>{if(e.y>H-60&&e.y<H-20&&Math.abs(e.x-ship.x)<20){e.dead=true;lives--;document.getElementById('livesEl').textContent=Math.max(0,lives);if(lives<=0)die()}});bullets.forEach(b=>{enemies.forEach(e=>{if(!e.dead&&Math.abs(b.x-e.x)<e.w/2&&Math.abs(b.y-e.y)<e.h/2){e.dead=true;b.dead=true;score+=10;document.getElementById('scoreEl').textContent=score}})});bullets=bullets.filter(b=>!b.dead);enemies=enemies.filter(e=>!e.dead&&e.y<H+30);ship.x+=ship.dx;ship.x=Math.max(ship.w/2,Math.min(W-ship.w/2,ship.x));draw();rafId=requestAnimationFrame(loop)}

document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')ship.dx=0});
document.getElementById('newBtn').addEventListener('click',()=>{init();loop()});document.getElementById('playAgainBtn').addEventListener('click',()=>{init();loop()});
init();loop()})();<\/script></body></html>

function drop(col){if(over||turn!==1)return;var row=findRow(col);if(row<0)return;board[row][col]=1;var win=checkWin();render();if(win){over=true;wins++;document.getElementById('winsEl').textContent=wins;showWin(true);return}if(isFull()){over=true;showWin(null);return}turn=2;document.getElementById('status').textContent='AI thinking...';setTimeout(aiMove,400)}
function findRow(col){for(var r=ROWS-1;r>=0;r--)if(board[r][col]===0)return r;return -1}
function aiMove(){if(over)return;var col=bestCol();if(col<0)return;var row=findRow(col);board[row][col]=2;var win=checkWin();render();if(win){over=true;losses++;document.getElementById('lossesEl').textContent=losses;showWin(false);return}if(isFull()){over=true;showWin(null);return}turn=1;document.getElementById('status').textContent='Your turn (red)'}
function bestCol(){var bestScore=-Infinity,bestC=-1;for(var c=0;c<COLS;c++){var r=findRow(c);if(r<0)continue;board[r][c]=2;var s=minimax(DEPTH-1,-Infinity,Infinity,false);board[r][c]=0;if(s>bestScore){bestScore=s;bestC=c}}return bestC}
function minimax(depth,alpha,beta,isMax){var w=checkWin();if(w===2)return 1000+depth;if(w===1)return -1000-depth;if(isFull()||depth===0)return 0;if(isMax){var v=-Infinity;for(var c=0;c<COLS;c++){var r=findRow(c);if(r<0)continue;board[r][c]=2;v=Math.max(v,minimax(depth-1,alpha,beta,false));board[r][c]=0;alpha=Math.max(alpha,v);if(beta<=alpha)break}return v}else{var v=Infinity;for(var c=0;c<COLS;c++){var r=findRow(c);if(r<0)continue;board[r][c]=1;v=Math.min(v,minimax(depth-1,alpha,beta,true));board[r][c]=0;beta=Math.min(beta,v);if(beta<=alpha)break}return v}}
function checkWin(){for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){var v=board[r][c];if(!v)continue;for(var d=0;d<4;d++){var dr=[0,1,1,1][d],dc=[1,0,1,-1][d];var ok=true;for(var k=1;k<4;k++){var nr=r+dr*k,nc=c+dc*k;if(nr<0||nr>=ROWS||nc<0||nc>=COLS||board[nr][nc]!==v){ok=false;break}}if(ok)return v}}return 0}
function isFull(){return board[0].every(v=>v)}
function showWin(won){if(won===null){document.getElementById('winTitle').textContent="IT'S A DRAW";document.getElementById('winMsg').textContent='Board is full';document.getElementById('winIcon').textContent='🤝'}else if(won){document.getElementById('winTitle').textContent='YOU WIN!';document.getElementById('winMsg').textContent='4 in a row!';document.getElementById('winIcon').textContent='🎉'}else{document.getElementById('winTitle').textContent='YOU LOSE';document.getElementById('winMsg').textContent='AI connected 4';document.getElementById('winIcon').textContent='💀'}document.getElementById('winOverlay').classList.add('show')}

<header><div class="brand"><div class="brand-icon">🍬</div><div><h1>%%GAME_NAME%%</h1><p>#%%GAME_ID%% · @%%USERNAME%%</p></div></div><div class="stats"><div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="scoreEl">0</span></div><div class="stat"><span class="stat-label">Moves</span><span class="stat-value" id="movesEl">0</span></div></div></header>

<script>(function(){var CFG="%%CONFIG_VALUE%%";var N=8,COLORS=5,TARGET=parseInt(CFG,10)||300;var EMOJI=['🍎','🍇','🍋','🍇','🍊'];EMOJI=['🍎','🫐','🍋','🍇','🍊'];var board,selected,score,moves,busy,over;
function init(){score=0;moves=0;selected=null;busy=false;over=false;board=[];for(var r=0;r<N;r++){var row=[];for(var c=0;c<N;c++){var v;do{v=Math.floor(Math.random()*COLORS)}while((c>=2&&row[c-1]===v&&row[c-2]===v)||(r>=2&&board[r-1][c]===v&&board[r-2][c]===v));row.push(v)}board.push(row)}document.getElementById('scoreEl').textContent='0';document.getElementById('movesEl').textContent='0';render()}

function tap(r,c){if(busy||over)return;if(!selected){selected={r:r,c:c};render();return}if(selected.r===r&&selected.c===c){selected=null;render();return}if(Math.abs(selected.r-r)+Math.abs(selected.c-c)!==1){selected={r:r,c:c};render();return}busy=true;var sr=selected.r,sc=selected.c;selected=null;swap(sr,sc,r,c);var matches=findMatches();if(matches.length===0){setTimeout(()=>{swap(sr,sc,r,c);busy=false;render()},220)}else{moves++;document.getElementById('movesEl').textContent=moves;processMatches()}}

for(var c=0;c<N;c++){for(var r=0;r<N-2;r++){if(board[r][c]===board[r+1][c]&&board[r][c]===board[r+2][c]){var v=board[r][c];var end=r;while(end<N&&board[end][c]===v)end++;if(end-r>=3)for(var k=r;k<end;k++)m.push({r:k,c:c});r=end-1}}}

tent:center;font-size:34px}.win-card h2{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:900;color:#fbbf24;margin-bottom:6px}.win-card p{font-size:12px;color:#94a3b8;margin-bottom:20px}.win-stats{display:flex;justify-content:center;gap:16px;margin-bottom:20px;padding:12px;background:rgba(255,255,255,.03);border-radius:12px;flex-wrap:wrap}.win-stat-value{font-family:'Cinzel',serif;font-size:1.2rem;font-weight:900;color:#fbbf24;display:block}.win-stat-label{font-size:8px;color:#94a3b8;letter-spacing:.15em;text-transform:uppercase}@media(max-width:500px){.brand h1{font-size:.85rem}}</style></head>
<body>
<header><div class="brand"><div class="brand-icon">🎯</div><div><h1>%%GAME_NAME%%</h1><p>#%%GAME_ID%% · @%%USERNAME%%</p></div></div><div class="stats"><div class="stat"><span class="stat-label">Hits</span><span class="stat-value" id="hitsEl">0</span></div><div class="stat"><span class="stat-label">Misses</span><span class="stat-value" id="missesEl">0</span></div><div class="stat"><span class="stat-label">Time</span><span class="stat-value" id="timeEl">0s</span></div></div></header>
<main><div id="arena"></div></main>
<div class="controls"><button class="primary" id="newBtn">🔄 New Game</button></div>

<script>(function(){var CFG="%%CONFIG_VALUE%%";var SIZE_CFG={easy:65,normal:50,hard:35};var TARGET_SIZE=SIZE_CFG[CFG]||50;var DUR=30;var arena,hits,misses,score,timeLeft,timer,active,currentTarget,rafId;
function init(){arena=document.getElementById('arena');hits=0;misses=0;score=0;timeLeft=DUR;active=true;document.getElementById('hitsEl').textContent='0';document.getElementById('missesEl').textContent='0';document.getElementById('timeEl').textContent=DUR+'s';document.getElementById('winOverlay').classList.remove('show');arena.innerHTML='';if(timer)clearInterval(timer);timer=setInterval(()=>{timeLeft--;document.getElementById('timeEl').textContent=timeLeft+'s';if(timeLeft<=0)endGame()},1000);spawnTarget();arena.onclick=miss}
function spawnTarget(){if(!active)return;if(currentTarget)currentTarget.remove();var w=arena.clientWidth,h=arena.clientHeight;var t=document.createElement('div');t.className='target';t.style.width=TARGET_SIZE+'px';t.style.height=TARGET_SIZE+'px';var x=Math.random()*(w-TARGET_SIZE-10)+5;var y=Math.random()*(h-TARGET_SIZE-10)+5;t.style.left=x+'px';t.style.top=y+'px';t.textContent='🎯';t.addEventListener('click',e=>{e.stopPropagation();hitTarget(t,e)});arena.appendChild(t);currentTarget=t}
function hitTarget(t,e){if(!active)return;hits++;score+=Math.max(10,Math.floor(1000/(arena.clientWidth/TARGET_SIZE)));document.getElementById('hitsEl').textContent=hits;t.classList.add('hit');setTimeout(()=>{if(t.parentNode)t.remove();spawnTarget()},180)}
function miss(e){if(!active||e.target===currentTarget)return;misses++;document.getElementById('missesEl').textContent=misses;var m=document.createElement('div');m.className='miss-msg';m.textContent='✗';var r=arena.getBoundingClientRect();m.style.left=(e.clientX-r.left-8)+'px';m.style.top=(e.clientY-r.top-10)+'px';arena.appendChild(m);setTimeout(()=>m.remove(),500)}
function endGame(){active=false;clearInterval(timer);if(currentTarget)currentTarget.remove();document.getElementById('winHits').textContent=hits;var total=hits+misses;var acc=total?Math.round(hits/total*100):0;document.getElementById('winAcc').textContent=acc+'%';document.getElementById('winScore').textContent=score;document.getElementById('winOverlay').classList.add('show')}
document.getElementById('newBtn').addEventListener('click',init);document.getElementById('playAgainBtn').addEventListener('click',init);init()})();<\/script></body></html>

    sudoku:    { fields: [{ type:'buttons', id:'difficulty', label:'DIFFICULTY',  options:['easy','medium','hard'],    default:'easy', prettify:true }]},

    doodle:    { fields: [{ type:'buttons', id:'speed',      label:'SPEED',       options:['easy','normal','hard'],    default:'normal', prettify:true }]},
    bubble:    { fields: [{ type:'buttons', id:'difficulty', label:'START ROWS',  options:['easy','medium','hard'],    default:'medium', prettify:true }]},
    connect4:  { fields: [{ type:'buttons', id:'ai',         label:'AI LEVEL',    options:['easy','medium','hard'],    default:'medium', prettify:true }]},
    minesweeper:{ fields:[{ type:'buttons', id:'difficulty', label:'DIFFICULTY',  options:['easy','medium','hard'],    default:'easy', prettify:true }]},
    match3:    { fields: [{ type:'buttons', id:'target',     label:'TARGET SCORE',options:[200,300,500],               default:300, suffix:'pt' }]},
    dino:      { fields: [{ type:'buttons', id:'difficulty', label:'SPEED',       options:['easy','normal','hard'],    default:'normal', prettify:true }]},
    stack:     { fields: [{ type:'buttons', id:'speed',      label:'BLOCK SPEED', options:['easy','normal','hard'],    default:'normal', prettify:true }]},
    aimtrainer:{ fields: [{ type:'buttons', id:'difficulty', label:'TARGET SIZE', options:['easy','normal','hard'],    default:'normal', prettify:true }]}
  };
  var chosenGame = null, finalShareUrl = '', finalGameID = '', finalUsername = '', finalGameName = '';
  function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function slugify(s){ return String(s||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
  function prettify(slug){ if(!slug) return ''; return slug.split('-').map(function(w){ return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase(); }).join(' '); }
  function prettierName(raw){ return String(raw||'').replace(/\s+/g,' ').trim(); }
  function getBaseUrl(){ return location.href.split('#')[0].split('?')[0]; }
  function setScreen(html){ document.getElementById('lyraRoot').innerHTML = html; }
  function loadTemplate(gametype){ var el = document.getElementById('tpl-' + gametype); if (!el) return ''; return el.textContent.replace(/<\\\//g, '</'); }
  function buildGame(gametype, gameName, gameID, username, config){ var tpl = loadTemplate(gametype); if (!tpl) return ''; config = config || {}; var configValue = config.value || ''; return tpl.split('%%GAME_NAME%%').join(escHtml(gameName)).split('%%GAME_ID%%').join(escHtml(gameID)).split('%%USERNAME%%').join(escHtml(username)).split('%%CONFIG_VALUE%%').join(escHtml(configValue)); }
  function parseRoute(){ var rawHash = location.hash.slice(1); if (!rawHash) return null; var pipeParts = rawHash.split('|'); var mainHash = pipeParts[0]; try { mainHash = decodeURIComponent(mainHash); } catch(e){} var parts = mainHash.split('+'); if (parts.length < 2) return null; var gameID = parts[0].trim(), username = parts[1].trim(); if (!gameID || !username) return null; var firstDash = gameID.indexOf('-'); var gametype, nameSlug; if (firstDash > 0){ gametype = gameID.substring(0, firstDash).toLowerCase(); nameSlug = gameID.substring(firstDash+1); } else { gametype = gameID.toLowerCase(); nameSlug = ''; } if (!GAMES[gametype]) return null; var gameName = prettify(nameSlug) || GAMES[gametype].label; var config = {}; config.value = pipeParts[1] ? decodeURIComponent(pipeParts[1]) : ''; return { gametype: gametype, gameID: gameID, username: username, gameName: gameName, nameSlug: nameSlug, config: config }; }
  function openGameInIframe(route){ var html = buildGame(route.gametype, route.gameName, route.gameID, route.username, route.config); if (!html){ renderLanding(); return; } document.title = route.gameName + ' — LYRA GAME BUILDER'; document.body.innerHTML = ''; document.body.style.cssText = 'margin:0;padding:0;overflow:hidden;background:#020617;display:block;min-height:100vh;'; var iframe = document.createElement('iframe'); iframe.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:none;display:block;'; iframe.setAttribute('allow', 'autoplay; fullscreen'); document.body.appendChild(iframe); iframe.srcdoc = html; }
  function renderLanding(){ setScreen('<div class="screen active"><div class="card"><div class="badge">◆ POWERED BY TAQI CLOUD</div><h1>LYRA <span>GAME</span> BUILDER</h1><p class="byline">Crafted by <b>MUHAMMAD TAQI</b></p><button class="cta" onclick="window.__lyraGoChoose()">◈ CREATE YOUR GAME</button><div class="version">v6.0 · 20 ADVANCED GAMES</div></div></div>'); }
  function renderChoose(){ var cards = Object.keys(GAMES).map(function(key){ var g = GAMES[key]; return '<div class="game-card" onclick="window.__lyraSelectGame(\'' + key + '\')"><div class="game-icon">' + g.icon + '</div><h3>' + g.label + '</h3><p>' + g.sub + '</p></div>'; }).join(''); setScreen('<div class="screen active"><div class="card"><div class="step">STEP 1 OF 3</div><h2>CHOOSE YOUR GAME</h2><p class="sub">20 advanced game engines · PC + Mobile</p><div class="game-grid">' + cards + '</div><button class="back" onclick="window.__lyraGoLanding()">← BACK</button></div></div>'); }
  function renderConfigFields(gametype){ var cfg = GAME_CONFIGS[gametype]; if (!cfg) return ''; return cfg.fields.map(function(f){ if (f.type === 'buttons'){ var btns = f.options.map(function(o){ var display = f.suffix ? (o + f.suffix) : (f.prettify ? (o.charAt(0).toUpperCase()+o.slice(1)) : o); var active = (o == f.default) ? ' active' : ''; return '<button type="button" class="grid-btn' + active + '" data-field="' + f.id + '" data-value="' + o + '">' + display + '</button>'; }).join(''); return '<label>' + f.label + '</label><div class="grid-options">' + btns + '</div>'; } return ''; }).join(''); }
  function renderDetails(gametype){
    var g = GAMES[gametype];
    setScreen('<div class="screen active"><div class="card"><div class="step">STEP 2 OF 3</div><h2>NAME YOUR GAME</h2><p class="sub">Give your game a name and choose a username</p><div class="chosen-game"><span class="icon">' + g.icon + '</span><span>' + g.label + '</span></div><label>GAME NAME</label><input class="inp" id="inGameName" maxlength="30" placeholder="e.g. MY ' + g.label + ' ARENA"><label>USERNAME</label><div class="hash-wrap"><span>@</span><input class="inp" id="inUsername" maxlength="20" placeholder="e.g. taqi"></div>' + renderConfigFields(gametype) + '<div class="preview" id="urlPreview">Fill in the fields to preview your URL</div><button class="cta" onclick="window.__lyraPublish()">🚀 PUBLISH GAME</button><button class="back" onclick="window.__lyraGoChoose()">← BACK</button></div></div>');
    var gi = document.getElementById('inGameName'), un = document.getElementById('inUsername'), pv = document.getElementById('urlPreview'), btns = document.querySelectorAll('.grid-btn');
    for (var i=0; i<btns.length; i++){ (function(btn){ btn.addEventListener('click', function(){ var field = btn.dataset.field; var sameField = document.querySelectorAll('[data-field="' + field + '"]'); for (var j=0; j<sameField.length; j++) sameField[j].classList.remove('active'); btn.classList.add('active'); updatePreview(); }); })(btns[i]); }
    function updatePreview(){ var name = slugify(gi.value), user = un.value.trim().replace(/\s+/g, ''); if (!name || !user){ pv.innerHTML = 'Fill in the fields to preview your URL'; pv.style.opacity = '.75'; return; } var gid = gametype + '-' + name, suffix = ''; var cfg = GAME_CONFIGS[gametype]; if (cfg){ var vals = []; cfg.fields.forEach(function(f){ if (f.type === 'buttons'){ var active = document.querySelector('[data-field="' + f.id + '"].active'); vals.push(active ? active.dataset.value : f.default); } }); suffix = '|' + encodeURIComponent(vals[0] || ''); } pv.innerHTML = '🔗 <span class="domain">' + escHtml(getBaseUrl()) + '</span><span class="hash">#' + escHtml(gid) + '+' + escHtml(user) + escHtml(suffix) + '</span>'; pv.style.opacity = '1'; }
    gi.addEventListener('input', updatePreview); un.addEventListener('input', updatePreview); setTimeout(function(){ gi.focus(); }, 100);
  }
  function renderSuccess(){ setScreen('<div class="screen active"><div class="card"><div class="tick">✓</div><h2>GAME PUBLISHED!</h2><p class="sub">Share this URL — anyone who opens it plays your game directly</p><div class="url-display">🔗 <span class="domain">' + escHtml(getBaseUrl()) + '</span><span class="hash">#' + escHtml(finalGameID) + '+' + escHtml(finalUsername) + '</span></div><div class="meta">Game: <b style="color:#c7d2fe">' + escHtml(finalGameName) + '</b> · Creator: <b style="color:#c084fc">#' + escHtml(finalUsername) + '</b></div><button class="cta" style="margin-top:24px" onclick="window.__lyraOpenGame()">🎮 OPEN GAME</button><div class="rows"><button class="ghost" onclick="window.__lyraCopyLink()">🔗 COPY LINK</button><button class="ghost" onclick="window.__lyraNewGame()">+ NEW GAME</button></div></div></div>'); }
  window.__lyraGoLanding = function(){ renderLanding(); };

    if (!rawUser){ alert('Please enter a username.'); un.focus(); return; }
    var nameSlug = slugify(rawName);

  };

  function copyText(text, msg){ if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ alert(msg); }).catch(function(){ fallbackCopy(text, msg); }); } else fallbackCopy(text, msg); }

  function boot(){ var route = parseRoute(); if (route){ openGameInIframe(route); return; } renderLanding(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
