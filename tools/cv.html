<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Builder — Created by Muhammad Taqi</title>
<style>
  :root{
    --bg:#0b1220;
    --panel:#101a2c;
    --panel-2:#0d1626;
    --line:#22314c;
    --text:#e8eefb;
    --muted:#8ba0bd;
    --accent:#38bdf8;
    --accent-2:#6366f1;
    --danger:#f87171;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ================= HEADER ================= */
  .app-header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:12px 20px;
    background:linear-gradient(90deg,#0d1626,#132036 60%,#0d1626);
    border-bottom:1px solid var(--line);
    z-index:5;
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{
    width:42px;height:42px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;font-weight:800;font-size:15px;color:#04121f;
    letter-spacing:.5px;
    box-shadow:0 6px 18px rgba(56,189,248,.28);
  }
  .brand h1{font-size:17px;margin:0;letter-spacing:.3px}
  .brand p{margin:1px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.4px}
  .brand p b{color:var(--accent);font-weight:600}

  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    border:1px solid var(--line);
    background:#131f34;
    color:var(--text);
    font:inherit;font-size:13px;font-weight:600;
    padding:9px 14px;border-radius:10px;cursor:pointer;
    transition:.18s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{background:#1a2a45;border-color:#2f4straight}
  .btn:hover{background:#1a2a45;border-color:#33507e;transform:translateY(-1px)}
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border:none;color:#04121f;
    box-shadow:0 8px 22px rgba(56,189,248,.28);
  }
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.small{padding:7px 11px;font-size:12px;border-radius:8px}
  .btn.danger:hover{border-color:var(--danger);color:var(--danger)}

  /* ================= LAYOUT ================= */
  .layout{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:440px 1fr;
  }
  .editor{
    overflow-y:auto;
    padding:18px 18px 60px;
    background:var(--bg);
    border-right:1px solid var(--line);
  }
  .editor::-webkit-scrollbar,.preview-wrap::-webkit-scrollbar{width:10px}
  .editor::-webkit-scrollbar-thumb,.preview-wrap::-webkit-scrollbar-thumb{
    background:#1d2c46;border-radius:20px;border:2px solid var(--bg);
  }
  .preview-wrap{
    overflow:auto;
    padding:26px;
    background:
      radial-gradient(1000px 500px at 70% -10%,rgba(56,189,248,.08),transparent 60%),
      #080f1b;
  }

  /* ================= FORM ================= */
  .group{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    margin-bottom:14px;
  }
  .group > h2{
    font-size:12px;text-transform:uppercase;letter-spacing:.12em;
    color:var(--accent);margin:0 0 12px;font-weight:700;
    display:flex;align-items:center;gap:8px;
  }
  .group > h2 .num{
    width:20px;height:20px;border-radius:6px;flex:0 0 auto;
    background:rgba(56,189,248,.14);color:var(--accent);
    display:grid;place-items:center;font-size:11px;
  }
  label{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
  label:last-child{margin-bottom:0}
  input,textarea{
    width:100%;margin-top:5px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:9px;
    padding:9px 11px;
    font:inherit;font-size:13px;
    outline:none;transition:.16s;
    resize:vertical;
  }
  input::placeholder,textarea::placeholder{color:#54678a}
  input:focus,textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(56,189,248,.14);
    background:#0a1322;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}

  .item{
    position:relative;
    background:var(--panel-2);
    border:1px dashed #263854;
    border-radius:11px;
    padding:12px 12px 4px;
    margin-bottom:10px;
  }
  .item .del{
    position:absolute;top:8px;right:8px;
    width:24px;height:24px;border-radius:7px;
    border:1px solid var(--line);background:#152238;color:#93a3bd;
    cursor:pointer;font-size:12px;line-height:1;display:grid;place-items:center;
    transition:.16s;
  }
  .item .del:hover{background:#3a1620;color:var(--danger);border-color:var(--danger)}
  .add-row{display:flex;gap:8px;margin-top:4px}
  .add-row .btn{flex:1;justify-content:center;border-style:dashed}

  .photo-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .photo-preview{
    width:64px;height:64px;border-radius:50%;flex:0 0 auto;
    background:#0a1322 center/cover no-repeat;
    border:2px solid #263854;
    display:grid;place-items:center;color:#54678a;font-size:22px;
  }
  .photo-row .btns{display:flex;gap:7px;flex-wrap:wrap}

  /* ================= CV / PREVIEW ================= */
  .cv{
    width:100%;
    max-width:820px;
    min-height:1120px;
    margin:0 auto;
    background:#fff;
    color:#1f2937;
    border-radius:6px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    font-size:13px;
    line-height:1.55;
    box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  .cv-head{
    background:#132036;
    color:#fff;
    padding:30px 34px;
    display:flex;
    align-items:center;
    gap:24px;
  }
  .cv-head-info{flex:1;min-width:0}
  .cv-name{font-size:31px;font-weight:800;margin:0;letter-spacing:.5px;line-height:1.15;word-break:break-word}
  .cv-role{
    margin:7px 0 0;font-size:12.5px;font-weight:600;
    letter-spacing:2px;text-transform:uppercase;color:#7dd3fc;
  }
  .cv-contact{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:11.5px;color:#c7d4e6}
  .cv-contact span{display:inline-flex;align-items:center;gap:6px;word-break:break-word}
  .cv-contact svg{width:13px;height:13px;flex:0 0 auto;color:#7dd3fc}
  .cv-photo{
    width:104px;height:104px;border-radius:50%;flex:0 0 auto;
    background:#1e3a5f center/cover no-repeat;
    border:3px solid rgba(125,211,252,.4);
    display:grid;place-items:center;
    font-size:34px;font-weight:800;color:#7dd3fc;letter-spacing:1px;
  }
  .cv-body{display:flex;flex:1;align-items:stretch}
  .cv-main{flex:1 1 62%;padding:26px 30px;min-width:0}
  .cv-side{
    flex:0 0 34%;background:#f1f5f9;padding:26px 22px;
    border-left:1px solid #e2e8f0;min-width:0;
  }
  .cv-sec{margin-bottom:22px;break-inside:avoid}
  .cv-sec:last-child{margin-bottom:0}
  .sec-title{
    font-size:11.5px;text-transform:uppercase;letter-spacing:.16em;
    color:#0f2a4a;font-weight:800;margin:0 0 12px;padding-bottom:6px;
    border-bottom:2px solid #132036;
  }
  .cv-side .sec-title{border-bottom-color:#cbd5e1}
  .summary{margin:0;color:#334155;font-size:12.5px;white-space:pre-line}

  .exp-item{margin-bottom:15px;break-inside:avoid}
  .exp-item:last-child{margin-bottom:0}
  .exp-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .exp-title{font-weight:700;font-size:13.5px;color:#0f172a}
  .exp-dates{font-size:11px;color:#64748b;white-space:nowrap;font-weight:600}
  .exp-company{font-size:12.5px;color:#2563eb;font-weight:600;margin-top:1px}
  .exp-desc{margin:6px 0 0;padding-left:16px;color:#334155}
  .exp-desc li{margin-bottom:3px;font-size:12.5px}

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    background:#132036;color:#e2ecf9;
    font-size:11px;font-weight:600;
    padding:4px 10px;border-radius:999px;letter-spacing:.2px;
  }
  .langs{list-style:none;margin:0;padding:0}
  .langs li{font-size:12.5px;color:#334155;padding:3px 0;display:flex;align-items:center;gap:7px}
  .langs li::before{content:"";width:6px;height:6px;border-radius:50%;background:#2563eb;flex:0 0 auto}

  .empty{color:#94a3b8;font-style:italic;font-size:12px}

  /* ================= RESPONSIVE ================= */
  @media (max-width: 920px){
    body{overflow:auto;height:auto;display:block}
    .layout{grid-template-columns:1fr;height:auto}
    .editor{overflow:visible;border-right:none;border-bottom:1px solid var(--line);padding-bottom:26px}
    .preview-wrap{overflow:visible;padding:18px}
    .cv{min-height:auto}
    .cv-body{flex-direction:column}
    .cv-side{border-left:none;border-top:1px solid #e2e8f0;flex:1 1 auto}
    .cv-head{flex-direction:column-reverse;text-align:center;padding:24px}
    .cv-contact{justify-content:center}
  }
  @media (max-width: 520px){
    .grid2{grid-template-columns:1fr}
    .brand h1{font-size:15px}
    .cv-name{font-size:25px}
  }

  /* ================= PRINT ================= */
  @page{size:A4;margin:0}
  @media print{
    html,body{height:auto;overflow:visible;background:#fff}
    .app-header,.editor{display:none !important}
    .layout{display:block;height:auto}
    .preview-wrap{padding:0;overflow:visible;background:#fff}
    .cv{
      width:210mm;max-width:none;min-height:297mm;
      box-shadow:none;border-radius:0;margin:0;
    }
    .cv-body{min-height:calc(297mm - 164px)}
  }
</style>
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="app-header">
  <div class="brand">
    <div class="logo">CV</div>
    <div>
      <h1>CV Builder</h1>
      <p>Created by <b>Muhammad Taqi</b></p>
    </div>
  </div>
  <div class="actions">
    <button class="btn" id="btnSample">Sample Data</button>
    <button class="btn danger" id="btnReset">Reset</button>
    <button class="btn primary" id="btnPrint">⬇ Download PDF</button>
  </div>
</header>

<div class="layout">

  <!-- ================= EDITOR ================= -->
  <section class="editor">

    <div class="group">
      <h2><span class="num">1</span> Personal Details</h2>
      <div class="photo-row">
        <div class="photo-preview" id="photoPreview">👤</div>
        <div class="btns">
          <label class="btn small" for="f-photo" style="margin:0;text-transform:none;letter-spacing:0;color:var(--text)">Upload Photo</label>
          <input type="file" id="f-photo" accept="image/*" hidden>
          <button class="btn small danger" id="btnPhotoRemove">Remove</button>
        </div>
      </div>
      <div class="grid2">
        <label>Full Name<input id="f-name" placeholder="Muhammad Taqi"></label>
        <label>Job Title<input id="f-role" placeholder="Frontend Developer"></label>
        <label>Email<input id="f-email" placeholder="you@email.com"></label>
        <label>Phone<input id="f-phone" placeholder="+92 300 1234567"></label>
        <label>Location<input id="f-location" placeholder="Karachi, Pakistan"></label>
        <label>Website<input id="f-website" placeholder="yoursite.com"></label>
      </div>
      <label>LinkedIn<input id="f-linkedin" placeholder="linkedin.com/in/username"></label>
    </div>

    <div class="group">
      <h2><span class="num">2</span> Professional Summary</h2>
      <textarea id="f-summary" rows="4" placeholder="Write a short professional summary about yourself..."></textarea>
    </div>

    <div class="group">
      <h2><span class="num">3</span> Work Experience</h2>
      <div id="expList"></div>
      <div class="add-row">
        <button class="btn small" id="btnAddExp">+ Add Experience</button>
      </div>
    </div>

    <div class="group">
      <h2><span class="num">4</span> Education</h2>
      <div id="eduList"></div>
      <div class="add-row">
        <button class="btn small" id="btnAddEdu">+ Add Education</button>
      </div>
    </div>

    <div class="group">
      <h2><span class="num">5</span> Skills &amp; Languages</h2>
      <label>Skills <span style="text-transform:none;letter-spacing:0">(comma separated)</span>
        <input id="f-skills" placeholder="HTML, CSS, JavaScript, React">
      </label>
      <label>Languages <span style="text-transform:none;letter-spacing:0">(comma separated)</span>
        <input id="f-langs" placeholder="English, Urdu">
      </label>
    </div>

  </section>

  <!-- ================= PREVIEW ================= -->
  <section class="preview-wrap">
    <div class="cv" id="cv">
      <header class="cv-head">
        <div class="cv-head-info">
          <h1 class="cv-name" id="cvName">Your Name</h1>
          <p class="cv-role" id="cvRole">Your Professional Title</p>
          <div class="cv-contact" id="cvContact"></div>
        </div>
        <div class="cv-photo" id="cvPhoto"></div>
      </header>

      <div class="cv-body">
        <main class="cv-main">
          <section class="cv-sec" id="secSummary">
            <h2 class="sec-title">Profile</h2>
            <p class="summary" id="cvSummary"></p>
          </section>
          <section class="cv-sec" id="secExp">
            <h2 class="sec-title">Work Experience</h2>
            <div id="cvExp"></div>
          </section>
          <section class="cv-sec" id="secEdu">
            <h2 class="sec-title">Education</h2>
            <div id="cvEdu"></div>
          </section>
        </main>

        <aside class="cv-side">
          <section class="cv-sec" id="secSkills">
            <h2 class="sec-title">Skills</h2>
            <div class="chips" id="cvSkills"></div>
          </section>
          <section class="cv-sec" id="secLangs">
            <h2 class="sec-title">Languages</h2>
            <ul class="langs" id="cvLangs"></ul>
          </section>
        </aside>
      </div>
    </div>
  </section>

</div>

<script>
/* ======================= HELPERS ======================= */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const val = (sel) => $(sel).value.trim();
const STORE_KEY = 'cv-builder-by-muhammad-taqi';

/* ======================= ICONS ======================= */
const ICONS = {
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4.5 7.2 7.5 5.4 7.5-5.4"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6.4 3.5h3l1.6 4-2 1.4a12.5 12.5 0 0 0 6.1 6.1l1.4-2 4 1.6v3a2 2 0 0 1-2.1 2A17.4 17.4 0 0 1 4.4 5.6a2 2 0 0 1 2-2.1z"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>',
  globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5a14 14 0 0 1 0 17 14 14 0 0 1 0-17z"/></svg>',
  linkedin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8 10.5V16M8 7.7v.1M12 16v-3.3a1.9 1.9 0 0 1 3.8 0V16"/></svg>'
};

/* ======================= STATE ======================= */
const state = { photo: '' };

/* ======================= EDITOR ITEM TEMPLATES ======================= */
function expItemHTML(d = {}) {
  return `<div class="item">
    <button class="del" data-del title="Remove">✕</button>
    <div class="grid2">
      <label>Job Title<input data-f="title" value="${esc(d.title)}" placeholder="Software Engineer"></label>
      <label>Company<input data-f="company" value="${esc(d.company)}" placeholder="ABC Pvt Ltd"></label>
      <label>Start Date<input data-f="start" value="${esc(d.start)}" placeholder="Jan 2022"></label>
      <label>End Date<input data-f="end" value="${esc(d.end)}" placeholder="Present"></label>
    </div>
    <label>Description <span style="text-transform:none;letter-spacing:0">(one point per line)</span>
      <textarea data-f="desc" rows="3" placeholder="Built responsive user interfaces&#10;Improved page load speed by 40%">${esc(d.desc)}</textarea>
    </label>
  </div>`;
}

function eduItemHTML(d = {}) {
  return `<div class="item">
    <button class="del" data-del title="Remove">✕</button>
    <div class="grid2">
      <label>Degree<input data-f="degree" value="${esc(d.degree)}" placeholder="BS Computer Science"></label>
      <label>Institute<input data-f="school" value="${esc(d.school)}" placeholder="University of Karachi"></label>
      <label>Start Date<input data-f="start" value="${esc(d.start)}" placeholder="2018"></label>
      <label>End Date<input data-f="end" value="${esc(d.end)}" placeholder="2022"></label>
    </div>
    <label>Details (optional)<input data-f="desc" value="${esc(d.desc)}" placeholder="CGPA 3.8 / 4.0"></label>
  </div>`;
}

/* ======================= COLLECT DATA ======================= */
function readList(container) {
  return $$('.item', container).map(item => {
    const o = {};
    $$('[data-f]', item).forEach(el => { o[el.dataset.f] = el.value.trim(); });
    return o;
  });
}

function collect() {
  return {
    photo: state.photo,
    name: val('#f-name'),
    role: val('#f-role'),
    email: val('#f-email'),
    phone: val('#f-phone'),
    location: val('#f-location'),
    website: val('#f-website'),
    linkedin: val('#f-linkedin'),
    summary: $('#f-summary').value.trim(),
    skills: val('#f-skills').split(',').map(s => s.trim()).filter(Boolean),
    languages: val('#f-langs').split(',').map(s => s.trim()).filter(Boolean),
    experience: readList($('#expList')),
    education: readList($('#eduList'))
  };
}

/* ======================= RENDER PREVIEW ======================= */
function contactLine(icon, text) {
  if (!text) return '';
  return `<span>${ICONS[icon]}${esc(text)}</span>`;
}

function bullets(text) {
  const lines = String(text || '').split('\n')
    .map(l => l.replace(/^\s*[•\-\*\u2022]\s*/, '').trim())
    .filter(Boolean);
  if (!lines.length) return '';
  return `<ul class="exp-desc">${lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`;
}

function render() {
  const d = collect();

  /* --- header --- */
  $('#cvName').textContent = d.name || 'Your Name';
  const roleEl = $('#cvRole');
  roleEl.textContent = d.role || 'Your Professional Title';
  roleEl.style.display = d.role ? '' : 'none';

  $('#cvContact').innerHTML =
    contactLine('mail', d.email) +
    contactLine('phone', d.phone) +
    contactLine('pin', d.location) +
    contactLine('globe', d.website) +
    contactLine('linkedin', d.linkedin);

  /* --- photo / initials --- */
  const photoEl = $('#cvPhoto');
  if (d.photo) {
    photoEl.style.backgroundImage = `url(${d.photo})`;
    photoEl.textContent = '';
  } else {
    photoEl.style.backgroundImage = 'none';
    const initials = (d.name || '')
      .split(/\s+/).filter(Boolean).slice(0, 2)
      .map(w => w[0].toUpperCase()).join('');
    photoEl.textContent = initials || '👤';
  }

  /* --- summary --- */
  const hasSummary = !!d.summary;
  $('#secSummary').style.display = hasSummary ? '' : 'none';
  $('#cvSummary').textContent = d.summary;

  /* --- experience --- */
  const exps = d.experience.filter(e => e.title || e.company || e.desc);
  $('#secExp').style.display = exps.length ? '' : 'none';
  $('#cvExp').innerHTML = exps.map(e => {
    const dates = [e.start, e.end].filter(Boolean).join(' — ');
    return `<div class="exp-item">
      <div class="exp-head">
        <div class="exp-title">${esc(e.title || 'Job Title')}</div>
        ${dates ? `<div class="exp-dates">${esc(dates)}</div>` : ''}
      </div>
      ${e.company ? `<div class="exp-company">${esc(e.company)}</div>` : ''}
      ${bullets(e.desc)}
    </div>`;
  }).join('');

  /* --- education --- */
  const edus = d.education.filter(e => e.degree || e.school || e.desc);
  $('#secEdu').style.display = edus.length ? '' : 'none';
  $('#cvEdu').innerHTML = edus.map(e => {
    const dates = [e.start, e.end].filter(Boolean).join(' — ');
    return `<div class="exp-item">
      <div class="exp-head">
        <div class="exp-title">${esc(e.degree || 'Degree')}</div>
        ${dates ? `<div class="exp-dates">${esc(dates)}</div>` : ''}
      </div>
      ${e.school ? `<div class="exp-company">${esc(e.school)}</div>` : ''}
      ${e.desc ? `<div style="font-size:12.5px;color:#475569;margin-top:3px">${esc(e.desc)}</div>` : ''}
    </div>`;
  }).join('');

  /* --- skills --- */
  $('#secSkills').style.display = d.skills.length ? '' : 'none';
  $('#cvSkills').innerHTML = d.skills.map(s => `<span class="chip">${esc(s)}</span>`).join('');

  /* --- languages --- */
  $('#secLangs').style.display = d.languages.length ? '' : 'none';
  $('#cvLangs').innerHTML = d.languages.map(l => `<li>${esc(l)}</li>`).join('');
}

/* ======================= SAVE / LOAD ======================= */
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(collect())); } catch (e) {}
  }, 350);
}

function applyData(d) {
  $('#f-name').value     = d.name || '';
  $('#f-role').value     = d.role || '';
  $('#f-email').value    = d.email || '';
  $('#f-phone').value    = d.phone || '';
  $('#f-location').value = d.location || '';
  $('#f-website').value  = d.website || '';
  $('#f-linkedin').value = d.linkedin || '';
  $('#f-summary').value  = d.summary || '';
  $('#f-skills').value   = (d.skills || []).join(', ');
  $('#f-langs').value    = (d.languages || []).join(', ');

  $('#expList').innerHTML = (d.experience && d.experience.length
    ? d.experience : [{}]).map(expItemHTML).join('');
  $('#eduList').innerHTML = (d.education && d.education.length
    ? d.education : [{}]).map(eduItemHTML).join('');

  state.photo = d.photo || '';
  updatePhotoPreview();
  render();
}

function updatePhotoPreview() {
  const p = $('#photoPreview');
  if (state.photo) {
    p.style.backgroundImage = `url(${state.photo})`;
    p.textContent = '';
  } else {
    p.style.backgroundImage = 'none';
    p.textContent = '👤';
  }
}

/* ======================= EVENTS ======================= */
/* live update on any input inside editor */
$('.editor').addEventListener('input', (e) => {
  if (e.target.id === 'f-photo') return;
  render();
  save();
});

/* add / remove experience & education */
$('#btnAddExp').addEventListener('click', () => {
  $('#expList').insertAdjacentHTML('beforeend', expItemHTML());
  render(); save();
});
$('#btnAddEdu').addEventListener('click', () => {
  $('#eduList').insertAdjacentHTML('beforeend', eduItemHTML());
  render(); save();
});

document.addEventListener('click', (e) => {
  const del = e.target.closest('[data-del]');
  if (del) {
    del.closest('.item').remove();
    render(); save();
  }
});

/* photo upload */
$('#f-photo').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    state.photo = ev.target.result;
    updatePhotoPreview();
    render(); save();
  };
  reader.readAsDataURL(file);
});

$('#btnPhotoRemove').addEventListener('click', () => {
  state.photo = '';
  $('#f-photo').value = '';
  updatePhotoPreview();
  render(); save();
});

/* print / download PDF */
$('#btnPrint').addEventListener('click', () => window.print());

/* reset */
$('#btnReset').addEventListener('click', () => {
  if (!confirm('Reset everything? All entered data will be cleared.')) return;
  localStorage.removeItem(STORE_KEY);
  state.photo = '';
  applyData({});
  updatePhotoPreview();
  save();
});
