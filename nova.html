<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA Compiler — by Muhammad Taqi</title>
<style>
:root{
  --bg:#070a0f;--panel:#0d1117;--panel2:#111823;--line:#1e2733;--text:#e6edf6;--muted:#7c8797;
  --accent:#60a5fa;--ok:#34d399;--err:#f87171;--warn:#fbbf24;--gold:#fbbf24;
  --mono:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,'Segoe UI',Arial,sans-serif;overflow:hidden}
button{font-family:inherit}
#app{height:100vh;display:grid;grid-template-rows:auto 1fr auto}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;background:linear-gradient(135deg,#60a5fa,#818cf8);color:#06101d;display:grid;place-items:center;font-weight:900;font-size:18px;border-radius:8px;letter-spacing:-1px}
.brand h1{font-size:15px;margin:0;letter-spacing:.5px}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;font-size:10.5px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.spacer{flex:1}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;letter-spacing:.3px}
.btn:hover{background:#182130;border-color:#2c3a4d}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#60a5fa,#3b82f6);border-color:transparent;color:#04101f;font-weight:800}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
select.btn{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

/* ---------- main ---------- */
main{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);min-height:0}
.pane{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.pane-head{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel2);font-size:11.5px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.filename{margin-left:10px;font-family:var(--mono);color:#9fb2c9;font-size:11.5px}
.libs-hint{font-size:10.5px;letter-spacing:.5px;color:#5b6879;font-family:var(--mono)}

#editor{flex:1;width:100%;resize:none;border:0;outline:none;background:transparent;color:#cfe3ff;
  font-family:var(--mono);font-size:13.5px;line-height:1.75;padding:16px 18px;tab-size:2;caret-color:var(--accent)}
#editor::placeholder{color:#3d4859}

.tabs{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel2)}
.tab{background:transparent;border:0;color:var(--muted);padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.4px}
.tab:hover{color:var(--text);background:#182130}
.tab.active{color:var(--accent);background:#12243a}
.status{font-size:11px;font-family:var(--mono);color:var(--muted);padding-right:8px}
.status.running{color:var(--warn)}
.status.done{color:var(--ok)}
.status.error{color:var(--err)}

.view{display:none;flex:1;min-height:0}
.view.active{display:block}
#consoleView{overflow:auto;padding:14px 16px;font-family:var(--mono);font-size:12.8px;line-height:1.7}
.line{white-space:pre-wrap;word-break:break-word;margin-bottom:3px}
.line.out{color:#dbe7f5}
.line.sys{color:#63748a}
.line.ok{color:var(--ok)}
.line.err{color:var(--err)}
.line.warn{color:var(--warn)}
.line a{color:var(--accent)}
.io-row{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
.io-prompt{color:var(--gold);font-weight:600}
.io-input{flex:1;min-width:120px;background:#151d29;border:1px solid #2c3a4d;color:#fff;padding:8px 10px;border-radius:6px;font-family:var(--mono);font-size:12.5px;outline:none}
.io-input:focus{border-color:var(--accent)}
.io-ok{background:var(--accent);border:0;color:#04101f;font-weight:800;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:12px}

#previewView{position:relative;background:#0a0e14}
#preview{width:100%;height:100%;border:0;display:block;background:#fff}
.pubbar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;background:rgba(10,16,24,.92);
  border:1px solid var(--line);border-radius:10px;padding:8px 10px;backdrop-filter:blur(8px);font-size:11.5px;align-items:center;flex-wrap:wrap}
.pubbar input{flex:1;min-width:120px;background:#0e141d;border:1px solid #22303f;color:#9fb2c9;font-family:var(--mono);
  font-size:11px;padding:6px 8px;border-radius:6px;outline:none}
.pubbar .btn{padding:6px 12px;font-size:11px}

.statusbar{display:flex;align-items:center;gap:10px;padding:6px 16px;background:var(--panel);border-top:1px solid var(--line);font-size:11px;color:var(--muted);letter-spacing:.4px}
.statusbar .gold{color:var(--gold)}

/* scrollbars */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1f2a38;border-radius:6px;border:2px solid var(--panel)}
::-webkit-scrollbar-thumb:hover{background:#2c3a4d}

@media(max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .brand p{display:none}
  .libs-hint{display:none}
}
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">N</div>
      <div>
        <h1>NOVA <span>Compiler</span></h1>
        <p>Created by Muhammad Taqi</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="actions">
      <button class="btn primary" id="btnRun">▶ Run</button>
      <button class="btn ghost" id="btnPublish">🌐 Publish</button>
      <button class="btn ghost" id="btnFile">📁 File</button>
      <button class="btn ghost" id="btnClear">✕ Clear</button>
      <select class="btn" id="examples" title="Load example">
        <option value="">Examples ▾</option>
        <option value="basic">1 · Basics (a + b)</option>
        <option value="input">2 · Input &amp; Print</option>
        <option value="fb">3 · Publish Flappy Bird</option>
        <option value="ai">4 · Publish NOVA AI</option>
        <option value="sss">5 · Publish Stone Paper Seasor</option>
      </select>
    </div>
  </header>

  <main>
    <section class="pane">
      <div class="pane-head">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="filename">main.nova</span>
        <span class="spacer"></span>
        <span class="libs-hint">libs: fb · taqi_ai · sss</span>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="Write NOVA code here..."></textarea>
    </section>

    <section class="pane">
      <div class="tabs">
        <button class="tab active" data-tab="console">Console</button>
        <button class="tab" data-tab="preview">Preview</button>
        <span class="spacer"></span>
        <span class="status" id="status">ready</span>
      </div>
      <div class="view active" id="consoleView"></div>
      <div class="view" id="previewView">
        <iframe id="preview" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>
        <div class="pubbar" id="pubbar" style="display:none">
          <span style="color:#5b6879">URL</span>
          <input id="pubUrl" readonly>
          <button class="btn ghost" id="btnCopy">Copy</button>
          <button class="btn ghost" id="btnOpen">Open ↗</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <span>NOVA v1.0</span><span>·</span>
    <span class="gold">Created by MUHAMMAD TAQI</span>
    <span class="spacer"></span>
    <span id="libInfo">3 libraries loaded</span>
  </footer>
</div>

<div id="fullpreview" style="display:none;position:fixed;inset:0;z-index:9999;background:#000">
  <iframe id="fullframe" style="width:100%;height:100%;border:0;display:block"></iframe>
</div>

<input type="file" id="filePicker" accept=".html,.htm,.txt" style="display:none">

<textarea id="lib-fb" style="display:none">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;overflow:hidden;gap:8px}
.game-container{position:relative;display:flex;flex-direction:column;align-items:center;gap:15px}
.header{display:flex;justify-content:space-between;align-items:center;width:400px;padding:0 10px}
.score-display{color:#fff;font-size:2.5rem;font-weight:bold;text-shadow:0 0 20px rgba(255,255,255,.5),0 4px 8px rgba(0,0,0,.5);letter-spacing:2px}
.best-score{color:#ffd700;font-size:1.2rem;font-weight:bold;text-shadow:0 0 15px rgba(255,215,0,.6);letter-spacing:1px}
canvas{border-radius:15px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(79,172,254,.3);cursor:pointer;display:block;border:3px solid rgba(255,255,255,.2);transition:box-shadow .3s ease}
canvas:hover{box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 60px rgba(79,172,254,.5)}
.controls{display:flex;gap:15px;color:rgba(255,255,255,.8);font-size:.9rem;letter-spacing:.5px}
.controls span{background:rgba(255,255,255,.1);padding:8px 16px;border-radius:20px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);transition:all .3s ease}
.controls span:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4)}
.restart-btn{background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff;border:none;padding:12px 30px;font-size:1.1rem;font-weight:bold;border-radius:30px;cursor:pointer;letter-spacing:1px;transition:all .3s ease;box-shadow:0 8px 25px rgba(238,90,36,.4);text-transform:uppercase}
.restart-btn:hover{transform:translateY(-3px);box-shadow:0 12px 35px rgba(238,90,36,.6);background:linear-gradient(135deg,#ff7676,#ee6a3a)}
.restart-btn:active{transform:translateY(0)}
.creator{color:rgba(255,255,255,.45);font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase}
.creator a{color:#4facfe;text-decoration:none}
.creator a:hover{text-decoration:underline}
@media(max-width:450px){canvas{width:100%;max-width:400px;height:auto;border-radius:10px}.header{width:100%;max-width:400px}.score-display{font-size:2rem}}
</style>
</head>
<body>
<div class="game-container">
  <div class="header">
    <div class="score-display" id="scoreDisplay">0</div>
    <div class="best-score" id="bestScoreDisplay">🏆 Best: 0</div>
  </div>
  <canvas id="gameCanvas" width="400" height="600"></canvas>
  <div class="controls">
    <span>🖱️ Click / Tap</span>
    <span>⌨️ Space</span>
    <span>⬆️ Arrow Up</span>
  </div>
  <button class="restart-btn" id="restartBtn">🔄 Restart Game</button>
  <div class="creator">Created by <a href="{{FOUNDER_URL}}" target="_blank" rel="noopener">{{FOUNDER}}</a></div>
</div>
<script>
(function(){
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const scoreDisplay=document.getElementById('scoreDisplay'),bestScoreDisplay=document.getElementById('bestScoreDisplay'),restartBtn=document.getElementById('restartBtn');
const GAME_NAME="{{NAME}}";
const CANVAS_WIDTH=400,CANVAS_HEIGHT=600,GRAVITY=0.55,FLAP_FORCE=-8.5,PIPE_WIDTH=65,PIPE_GAP=150,PIPE_SPEED=2.8,PIPE_SPAWN_INTERVAL=85,BIRD_X=100,BIRD_RADIUS=18,GROUND_HEIGHT=80;
let bird={x:BIRD_X,y:CANVAS_HEIGHT/2,velocity:0,radius:BIRD_RADIUS,rotation:0};
let pipes=[],particles=[],score=0;
let bestScore=parseInt(localStorage.getItem('flappyBestScore'))||0;
let gameState='ready',frameCount=0,pipeSpawnCounter=0,groundX=0,starField=[],clouds=[],flashEffect=0,screenShake=0;
function initStars(){starField=[];for(let i=0;i<50;i++){starField.push({x:Math.random()*CANVAS_WIDTH,y:Math.random()*(CANVAS_HEIGHT-GROUND_HEIGHT-50),size:Math.random()*2+.5,twinkle:Math.random()*Math.PI*2,twinkleSpeed:Math.random()*.05+.02});}}
function initClouds(){clouds=[];for(let i=0;i<4;i++){clouds.push({x:Math.random()*CANVAS_WIDTH,y:Math.random()*(CANVAS_HEIGHT*.5)+30,width:Math.random()*80+60,height:Math.random()*25+15,speed:Math.random()*.3+.1,opacity:Math.random()*.3+.2});}}
function updateBestScoreDisplay(){bestScoreDisplay.textContent='🏆 Best: '+bestScore;}
function saveBestScore(){if(score>bestScore){bestScore=score;localStorage.setItem('flappyBestScore',bestScore);updateBestScoreDisplay();}}
function resetGame(){bird.y=CANVAS_HEIGHT/2;bird.velocity=0;bird.rotation=0;pipes=[];particles=[];score=0;frameCount=0;pipeSpawnCounter=0;groundX=0;screenShake=0;flashEffect=0;scoreDisplay.textContent='0';gameState='ready';}
function createPipe(){const gapY=Math.random()*(CANVAS_HEIGHT-GROUND_HEIGHT-PIPE_GAP-80)+40+PIPE_GAP/2;pipes.push({x:CANVAS_WIDTH+PIPE_WIDTH,gapY:gapY,gapSize:PIPE_GAP,width:PIPE_WIDTH,passed:false,topPipeHeight:gapY-PIPE_GAP/2,bottomPipeY:gapY+PIPE_GAP/2});}
function createParticles(x,y,count,color){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=Math.random()*4+1;particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,radius:Math.random()*4+2,color:color,life:Math.random()*30+20,maxLife:50,gravity:.15});}}
function createFlapParticles(){const colors=['#FFD700','#FFA500','#FF6347','#fff','#FFE4B5'];for(let i=0;i<5;i++){particles.push({x:bird.x-bird.radius*.5,y:bird.y+Math.random()*10-5,vx:-Math.random()*3-1,vy:Math.random()*4-2,radius:Math.random()*3+1,color:colors[Math.floor(Math.random()*colors.length)],life:Math.random()*15+10,maxLife:25,gravity:.05});}}
function flap(){if(gameState==='playing'){bird.velocity=FLAP_FORCE;bird.rotation=-.4;createFlapParticles();}else if(gameState==='ready'){gameState='playing';bird.velocity=FLAP_FORCE;bird.rotation=-.4;createFlapParticles();}else if(gameState==='gameover'){resetGame();gameState='ready';}}
function checkCollision(){if(bird.y+bird.radius>=CANVAS_HEIGHT-GROUND_HEIGHT)return true;if(bird.y-bird.radius<=0){bird.y=bird.radius;bird.velocity=0;}for(let p of pipes){if(bird.x+bird.radius>p.x&&bird.x-bird.radius<p.x+p.width){if(bird.y-bird.radius<p.topPipeHeight)return true;if(bird.y+bird.radius>p.bottomPipeY)return true;}}return false;}
function gameOver(){gameState='gameover';saveBestScore();createParticles(bird.x,bird.y,30,'#FF6B6B');createParticles(bird.x,bird.y,20,'#FFD700');screenShake=10;flashEffect=15;}
function update(){
 if(gameState==='playing'){
  frameCount++;bird.velocity+=GRAVITY;bird.y+=bird.velocity;
  if(bird.velocity<0)bird.rotation=Math.max(-.5,bird.rotation-.1);else bird.rotation=Math.min(Math.PI/3,bird.rotation+.08);
  pipeSpawnCounter++;if(pipeSpawnCounter>=PIPE_SPAWN_INTERVAL){createPipe();pipeSpawnCounter=0;}
  for(let i=pipes.length-1;i>=0;i--){pipes[i].x-=PIPE_SPEED;if(!pipes[i].passed&&pipes[i].x+pipes[i].width<bird.x){pipes[i].passed=true;score++;scoreDisplay.textContent=score;createParticles(bird.x+bird.radius,bird.y,8,'#FFD700');}if(pipes[i].x+pipes[i].width<-20)pipes.splice(i,1);}
  groundX-=PIPE_SPEED;if(groundX<=-20)groundX+=20;
  for(let c of clouds){c.x-=c.speed;if(c.x+c.width<-20){c.x=CANVAS_WIDTH+20;c.y=Math.random()*(CANVAS_HEIGHT*.5)+30;}}
  for(let s of starField)s.twinkle+=s.twinkleSpeed;
  if(checkCollision())gameOver();
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.life--;if(p.life<=0)particles.splice(i,1);}
  if(screenShake>0){screenShake*=.9;if(screenShake<.1)screenShake=0;}
  if(flashEffect>0)flashEffect--;
 }else if(gameState==='ready'){
  bird.y=CANVAS_HEIGHT/2+Math.sin(frameCount*.05)*15;bird.rotation=Math.sin(frameCount*.03)*.1;frameCount++;
  for(let c of clouds){c.x-=c.speed*.5;if(c.x+c.width<-20){c.x=CANVAS_WIDTH+20;c.y=Math.random()*(CANVAS_HEIGHT*.5)+30;}}
  for(let s of starField)s.twinkle+=s.twinkleSpeed;
 }else{
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.life--;if(p.life<=0)particles.splice(i,1);}
  if(screenShake>0){screenShake*=.9;if(screenShake<.1)screenShake=0;}
  if(flashEffect>0)flashEffect--;
 }
}
function drawBackground(){
 const g=ctx.createLinearGradient(0,0,0,CANVAS_HEIGHT-GROUND_HEIGHT);
 g.addColorStop(0,'#0a0a2e');g.addColorStop(.3,'#1a1a4e');g.addColorStop(.6,'#2d1b69');g.addColorStop(.85,'#e8a87c');g.addColorStop(1,'#f4d03f');
 ctx.fillStyle=g;ctx.fillRect(0,0,CANVAS_WIDTH,CANVAS_HEIGHT-GROUND_HEIGHT);
 for(let s of starField){const a=Math.sin(s.twinkle)*.5+.5;ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill();}
 for(let c of clouds){ctx.fillStyle='rgba(255,255,255,'+c.opacity+')';ctx.beginPath();ctx.ellipse(c.x,c.y,c.width/2,c.height/2,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(c.x+c.width*.25,c.y-c.height*.4,c.width*.35,c.height*.6,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(c.x-c.width*.2,c.y-c.height*.25,c.width*.3,c.height*.55,0,0,Math.PI*2);ctx.fill();}
 const sg=ctx.createRadialGradient(320,120,10,320,120,80);sg.addColorStop(0,'rgba(255,200,100,.8)');sg.addColorStop(.3,'rgba(255,180,80,.3)');sg.addColorStop(1,'rgba(255,160,60,0)');
 ctx.fillStyle=sg;ctx.fillRect(240,40,160,160);
 ctx.fillStyle='#FFE4A0';ctx.beginPath();ctx.arc(320,120,25,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='rgba(255,240,200,.6)';ctx.beginPath();ctx.arc(320,120,20,0,Math.PI*2);ctx.fill();
}
function drawGround(){
 const g=ctx.createLinearGradient(0,CANVAS_HEIGHT-GROUND_HEIGHT,0,CANVAS_HEIGHT);
 g.addColorStop(0,'#5d8a3c');g.addColorStop(.3,'#4a7a2e');g.addColorStop(1,'#2d5016');
 ctx.fillStyle=g;ctx.fillRect(0,CANVAS_HEIGHT-GROUND_HEIGHT,CANVAS_WIDTH,GROUND_HEIGHT);
 for(let i=-1;i<CANVAS_WIDTH/20+2;i++){const x=i*20+groundX;ctx.fillStyle='#6b9e45';ctx.fillRect(x,CANVAS_HEIGHT-GROUND_HEIGHT+15,10,10);ctx.fillRect(x+10,CANVAS_HEIGHT-GROUND_HEIGHT+5,10,10);}
 ctx.fillStyle='#8bc34a';ctx.fillRect(0,CANVAS_HEIGHT-GROUND_HEIGHT,CANVAS_WIDTH,4);
 ctx.fillStyle='#c5e1a5';ctx.fillRect(0,CANVAS_HEIGHT-GROUND_HEIGHT,CANVAS_WIDTH,2);
 const sh=ctx.createLinearGradient(0,CANVAS_HEIGHT-GROUND_HEIGHT,0,CANVAS_HEIGHT);sh.addColorStop(0,'rgba(0,0,0,.4)');sh.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=sh;ctx.fillRect(0,CANVAS_HEIGHT-GROUND_HEIGHT,CANVAS_WIDTH,15);
}
function drawPipes(){
 for(let p of pipes){
  const g=ctx.createLinearGradient(p.x,0,p.x+p.width,0);
  g.addColorStop(0,'#2e7d32');g.addColorStop(.3,'#4caf50');g.addColorStop(.5,'#66bb6a');g.addColorStop(.7,'#4caf50');g.addColorStop(1,'#1b5e20');
  ctx.fillStyle=g;ctx.fillRect(p.x,0,p.width,p.topPipeHeight);
  const cg=ctx.createLinearGradient(p.x,p.topPipeHeight-30,p.x+p.width,p.topPipeHeight);
  cg.addColorStop(0,'#1b5e20');cg.addColorStop(.5,'#388e3c');cg.addColorStop(1,'#1b5e20');
  ctx.fillStyle=cg;ctx.fillRect(p.x-5,p.topPipeHeight-30,p.width+10,30);
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(p.x-5,p.topPipeHeight-30,p.width+10,5);
  ctx.fillStyle=g;ctx.fillRect(p.x,p.bottomPipeY,p.width,CANVAS_HEIGHT-GROUND_HEIGHT-p.bottomPipeY);

<script>
(function(){
'use strict';

/* ================= base64 helpers ================= */
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ================= full-page preview mode (#nova=...) ================= */
if (location.hash.indexOf('#nova=') === 0){
  try{
    const html = b64decode(location.hash.slice(6));
    const app = document.getElementById('app');
    const fp  = document.getElementById('fullpreview');
    const fr  = document.getElementById('fullframe');
    if (app) app.style.display = 'none';
    if (fp) fp.style.display = 'block';
    if (fr) fr.srcdoc = html;
    document.title = 'NOVA · Published Page';
    return;
  }catch(e){ /* fall through to normal app */ }
}

/* ================= DOM ================= */
const $ = id => document.getElementById(id);
const editor   = $('editor');
const consoleEl= $('consoleView');
const preview  = $('preview');
const statusEl = $('status');
const pubbar   = $('pubbar');
const pubUrl   = $('pubUrl');

/* ================= libraries ================= */
const LIBS = {
  fb:      { el:'lib-fb',      def:'FLAPPY BIRD' },
  taqi_ai: { el:'lib-taqi_ai', def:'NOVA AI' },
  sss:     { el:'lib-sss',     def:'STONE PAPER SEASOR' }
};
const VFS = {};   // virtual file system (uploaded files)

/* ================= console helpers ================= */
function clearConsole(){ consoleEl.innerHTML = ''; }
function log(text, cls){
  const d = document.createElement('div');
  d.className = 'line ' + (cls || 'out');
  d.textContent = text;
  consoleEl.appendChild(d);
  consoleEl.scrollTop = consoleEl.scrollHeight;
  return d;
}
function logHTML(html, cls){
  const d = document.createElement('div');
  d.className = 'line ' + (cls || 'sys');
  d.innerHTML = html;
  consoleEl.appendChild(d);
  consoleEl.scrollTop = consoleEl.scrollHeight;
  return d;
}
function setStatus(t, cls){
  statusEl.textContent = t;
  statusEl.className = 'status ' + (cls || '');
}

/* interactive input */
function promptUser(question){
  return new Promise(resolve => {
    const row = document.createElement('div');
    row.className = 'io-row';
    const lbl = document.createElement('span');
    lbl.className = 'io-prompt';
    lbl.textContent = '❯ ' + question;
    const inp = document.createElement('input');
    inp.className = 'io-input';
    inp.type = 'text';
    const ok = document.createElement('button');
    ok.className = 'io-ok';
    ok.textContent = '↵';
    row.appendChild(lbl); row.appendChild(inp); row.appendChild(ok);
    consoleEl.appendChild(row);
    consoleEl.scrollTop = consoleEl.scrollHeight;
    inp.focus();
    let finished = false;
    const done = () => {
      if (finished) return;
      finished = true;
      const v = inp.value;
      inp.disabled = true; ok.disabled = true; ok.style.opacity = '.4';
      const echo = document.createElement('div');
      echo.className = 'line out';
      echo.textContent = v;
      consoleEl.appendChild(echo);
      resolve(v);
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); done(); } });
    ok.addEventListener('click', done);
  });
}

/* ================= source parsing ================= */
function parseSource(src){
  let text = String(src).replace(/\r\n/g, '\n');

  // collect library imports
  const imports = [];
  text = text.replace(/\[ZF\.QUEEN\[([^\]]+)\]\]/gi, (m, name) => {
    imports.push(name.trim());
    return '';
  });

  // find <body> ... <body> section
  let code = '';
  const start = text.indexOf('<body>');
  if (start !== -1){
    const rest = text.slice(start + 6);
    const end = rest.lastIndexOf('<body>');
    code = (end !== -1) ? rest.slice(0, end) : rest;
  } else {
    code = text.replace(/<\/?nova>/gi, '');
  }
  // strip any stray <nova> markers that survived
  code = code.replace(/<\/?nova>/gi, '');
  return { imports, code };
}

/* ================= value evaluation ================= */
function interpolate(tpl, vars){
  return String(tpl).replace(/'([^'\n]{1,120}?)'/g, (m, inner) => {
    const key = inner.trim();
    if (Object.prototype.hasOwnProperty.call(vars, key)) return String(vars[key]);
    return m;
  });
}

function tryNumber(expr, vars){
  let e = String(expr);
  const ids = e.match(/[A-Za-z_][A-Za-z0-9_]*/g);
  if (ids){
    const seen = new Set();
    for (const id of ids){
      if (seen.has(id)) continue;
      seen.add(id);
      if (typeof vars[id] === 'number'){
        e = e.replace(new RegExp('\\b' + id + '\\b', 'g'), String(vars[id]));
      } else {
        return null;
      }
    }
  }
  if (!/^[\d\s+\-*/().]+$/.test(e)) return null;
  if (!/\d/.test(e)) return null;
  try{
    const r = Function('"use strict";return (' + e + ');')();
    return (typeof r === 'number' && isFinite(r)) ? r : null;
  }catch(_){ return null; }
}

function evaluate(raw, vars){
  const num = tryNumber(raw, vars);
  if (num !== null) return num;
  return interpolate(raw, vars);
}

/* ================= html escaping ================= */
const ESC_MAP = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
function esc(s){ return String(s).replace(/[&<>"']/g, c => ESC_MAP[c]); }

/* ================= library page builder ================= */
function buildLibraryPage(key, vars){
  const lib = LIBS[key];
  if (!lib) return null;
  const node = document.getElementById(lib.el);
  if (!node) return null;

  const name    = (vars.NAME    != null) ? vars.NAME    : lib.def;
  const founder = (vars.FOUNDER != null) ? vars.FOUNDER : 'MUHAMMAD TAQI';
  const url     = (vars.FOUNDER_URL != null) ? vars.FOUNDER_URL : 'https://taqi.oneapp.dev/';

  return node.value
    .replace(/\{\{NAME\}\}/g, esc(name))
    .replace(/\{\{FOUNDER_URL\}\}/g, esc(url))
    .replace(/\{\{FOUNDER\}\}/g, esc(founder));
}

function resolvePage(target, vars){
  if (target == null) return null;
  const t = String(target).trim();
  if (!t) return null;

  // library key
  if (LIBS[t]) return buildLibraryPage(t, vars);

  // library key with .html suffix
  const noExt = t.replace(/\.html?$/i, '');
  if (LIBS[noExt]) return buildLibraryPage(noExt, vars);

  // virtual file system
  if (VFS[t]) return VFS[t];
  if (VFS[noExt]) return VFS[noExt];

  // raw html
  if (/^\s*</.test(t)) return t;

  return null;
}

/* ================= publishing ================= */
let lastShareUrl = '';

function publishHTML(html){
  // preview
  preview.srcdoc = html;
  switchTab('preview');

  // blob url
  let blobUrl = '';
  try{
    blobUrl = URL.createObjectURL(new Blob([html], { type:'text/html' }));
  }catch(_){}

  // hash url  →  <live-url>#nova=<base64>
  const base = location.href.split('#')[0];
  const shareUrl = base + '#nova=' + b64encode(html);
  lastShareUrl = shareUrl;

  pubbar.style.display = 'flex';
  pubUrl.value = shareUrl.length > 200 ? shareUrl.slice(0, 200) + '…' : shareUrl;
  pubUrl.dataset.full = shareUrl;
  $('btnOpen').dataset.url = shareUrl;

  log('🌐 Published successfully!', 'ok');
  if (blobUrl){
    logHTML('📄 Blob preview → <a href="' + blobUrl + '" target="_blank" rel="noopener">open in new tab</a>', 'sys');
  }
  logHTML('🔗 Share URL → <a href="' + shareUrl + '" target="_blank" rel="noopener">' +
          (shareUrl.length > 90 ? shareUrl.slice(0, 90) + '…' : shareUrl) + '</a>', 'sys');
  log('   (Share URL kholne par sirf full-page preview dikhega)', 'sys');
  return shareUrl;
}

/* ================= the interpreter ================= */
async function execute(src){
  const parsed = parseSource(src);
  const vars = {};

  if (parsed.imports.length){
    for (const imp of parsed.imports){
      if (LIBS[imp]) log('📦 Library imported: ' + imp, 'sys');
      else log('⚠️  Library not found: "' + imp + '"  (available: ' + Object.keys(LIBS).join(', ') + ')', 'warn');
    }
  }

  const lines = parsed.code.split('\n');

  for (let i = 0; i < lines.length; i++){
    const line = lines[i].trim();
    if (!line) continue;
    if (line.indexOf('//') === 0) continue;

    /* ---- print ---- */
    if (/^print\s*=/i.test(line)){
      let tpl = line.replace(/^print\s*=\s*/i, '');
      // bare identifier → variable
      if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(tpl) && vars[tpl] !== undefined){
        log(String(vars[tpl]), 'out');
      } else {
        log(interpolate(tpl, vars), 'out');
      }
      await tick();
      continue;
    }

    /* ---- publish ---- */
    if (/^publish\b/i.test(line)){
      let target = null;
      const mVar = line.match(/^publish\s*\{\{\s*\[\s*([A-Za-z_][A-Za-z0-9_]*)\s*\]\s*\}\}/i);
      if (mVar){
        target = vars[mVar[1]];
        if (target === undefined) log('⚠️  Variable "' + mVar[1] + '" is not defined.', 'warn');
      } else if (/^publish\s*=/i.test(line)){
        target = interpolate(line.replace(/^publish\s*=\s*/i, '').trim(), vars);
      } else {
        log('⚠️  Invalid publish syntax. Use  publish = fb   or   publish{{[a]}}', 'warn');
        continue;
      }

      const html = resolvePage(target, vars);
      if (!html){
        log('❌ Cannot publish "' + target + '". Unknown library / file.', 'err');
        log('   Available libraries: ' + Object.keys(LIBS).join(' · '), 'sys');
        log('   Tip: 📁 File button se apni .html file add kar sakte ho.', 'sys');
      } else {
        publishHTML(html);
      }
      await tick();
      continue;
    }

    /* ---- assignment ---- */
    const asg = line.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$/);
    if (asg){
      const name = asg[1];
      let value  = asg[2].trim();

      // input
      const mi = value.match(/^input\b\s*(.*)$/i);
      if (mi){
        let q = mi[1].trim().replace(/^['"]|['"]$/g, '');
        if (!q) q = 'Enter value for ' + name + ':';
        vars[name] = await promptUser(q);
        continue;
      }

      // FOUNDER = NAME = {CLICK = url}
      const mc = value.match(/^(.*?)\s*=\s*\{\s*CLICK\s*=\s*([^\s}]+)\s*\}$/i);
      if (mc){
        vars[name] = mc[1].trim();
        vars[name + '_URL'] = mc[2].trim();
        log('✓ ' + name + ' = ' + vars[name] + '  →  ' + vars[name + '_URL'], 'sys');
        await tick();
        continue;
      }

      vars[name] = evaluate(value, vars);
      await tick();
      continue;
    }

    log('⚠️  Line ' + (i + 1) + ': cannot understand → ' + line, 'warn');
    await tick();
  }
}

function tick(){ return new Promise(r => setTimeout(r, 0)); }

/* ================= run ================= */
let running = false;

async function run(){
  if (running) return;
  running = true;
  clearConsole();
  setStatus('running...', 'running');
  const t0 = performance.now();
  try{
    await execute(editor.value);
    const ms = Math.round(performance.now() - t0);
    setStatus('done · ' + ms + 'ms', 'done');
    log('— finished in ' + ms + 'ms —', 'sys');
  }catch(err){
    setStatus('error', 'error');
    log('❌ ' + (err && err.message ? err.message : String(err)), 'err');
  }
  running = false;
}

async function runPublish(){
  if (running) return;
  running = true;
  clearConsole();
  setStatus('publishing...', 'running');
  try{
    await execute(editor.value);
    setStatus('published', 'done');
  }catch(err){
    setStatus('error', 'error');
    log('❌ ' + (err && err.message ? err.message : String(err)), 'err');
  }
  running = false;
}

/* ================= tabs ================= */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  if (name === 'console') $('consoleView').classList.add('active');
  else $('previewView').classList.add('active');
}
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});

  navigator.clipboard.writeText(url).then(() => {
    this.textContent = 'Copied ✓';
    setTimeout(() => this.textContent = 'Copy', 1400);
  }).catch(() => { pubUrl.select(); document.execCommand('copy'); });
});

/* file upload → virtual file system */
$('btnFile').addEventListener('click', () => $('filePicker').click());
$('filePicker').addEventListener('change', function(){
  const f = this.files && this.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    VFS[f.name] = String(reader.result);
    log('📁 File added to virtual FS: ' + f.name + '  (' + Math.round(f.size / 1024) + ' KB)', 'ok');
    log('   Ab likh sakte ho:  a = ' + f.name + '  →  publish{{[a]}}', 'sys');
  };
  reader.readAsText(f);
  this.value = '';
});

/* editor niceties: Tab = 2 spaces */
editor.addEventListener('keydown', function(e){
  if (e.key === 'Tab'){
    e.preventDefault();
    const s = this.selectionStart, en = this.selectionEnd;
    this.value = this.value.slice(0, s) + '  ' + this.value.slice(en);
    this.selectionStart = this.selectionEnd = s + 2;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); run(); }
});
